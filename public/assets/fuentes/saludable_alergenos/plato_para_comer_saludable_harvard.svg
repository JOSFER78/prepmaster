<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background:#0c111d; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="veggieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="grainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="proteinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="820"/>
    <line x1="250" y1="0" x2="250" y2="820"/>
    <line x1="550" y1="0" x2="550" y2="820"/>
    <line x1="850" y1="0" x2="850" y2="820"/>
    <line x1="1050" y1="0" x2="1050" y2="820"/>
    <line x1="0" y1="100" x2="1100" y2="100"/>
    <line x1="0" y1="400" x2="1100" y2="400"/>
    <line x1="0" y1="720" x2="1100" y2="720"/>
  </g>

  <!-- Header Section -->
  <g id="header" transform="translate(50, 40)">
    <rect x="0" y="0" width="1000" height="75" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Red Badge -->
    <rect x="18" y="15" width="46" height="46" rx="10" fill="#dc2626"/>
    <text x="41" y="44" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>
    
    <!-- Title and Subtitle -->
    <text x="76" y="35" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="0.5">EL PLATO PARA COMER SALUDABLE</text>
    <text x="76" y="53" font-size="12" font-weight="600" fill="#94a3b8">Harvard T.H. Chan School of Public Health · The Nutrition Source (HSPH)</text>
    
    <!-- Right Badge -->
    <rect x="805" y="20" width="175" height="35" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="822" cy="37" r="5" fill="#22c55e"/>
    <text x="836" y="42" font-size="11.5" font-weight="700" fill="#e2e8f0">ESTÁNDAR CLÍNICO</text>
  </g>

  <!-- Left Side: Healthy Oils and Active Lifestyle Callouts -->
  <!-- 1. Healthy Oils (Top-Left) -->
  <g transform="translate(50, 135)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="#65a30d" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="url(#oilGrad)"/>
    <!-- Oil Bottle Icon -->
    <path d="M29 22 h6 v3 h-6 z M27 25 h10 l2 6 v10 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-10 z" fill="#ffffff" transform="translate(1, -2) scale(0.9)"/>
    <text x="56" y="34" font-size="14" font-weight="800" fill="#bef264">ACEITES SALUDABLES</text>
    <text x="14" y="65" font-size="11.5" font-weight="600" fill="#f8fafc">• Aceite de Oliva Virgen Extra</text>
    <text x="14" y="83" font-size="11" fill="#cbd5e1">  (AOVE), canola u otros de calidad.</text>
    <text x="14" y="103" font-size="11.5" font-weight="600" fill="#f87171">• Limitar la mantequilla.</text>
    <text x="14" y="123" font-size="11.5" font-weight="700" fill="#ef4444">• Evitar grasas trans industriales.</text>
  </g>

  <!-- 2. Stay Active (Bottom-Left) -->
  <g transform="translate(50, 560)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="145" rx="14" fill="url(#cardGrad)" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="url(#runGrad)"/>
    <!-- Running Figure Icon -->
    <path d="M30 20 a2.5 2.5 0 1 0 0 -5 a2.5 2.5 0 0 0 0 5 z M25 24 l4 2 l3 -2 l2 3 l-3 2 l-1 5 l-4 -1 l1 -4 l-3 -2 z M29 28 l3 4 l-1 6 h-3 l1 -4 l-3 -3 z" fill="#ffffff"/>
    <text x="56" y="34" font-size="14" font-weight="800" fill="#fdba74">MANTENTE ACTIVO</text>
    <text x="14" y="65" font-size="11.5" font-weight="600" fill="#f8fafc">• Ejercicio físico regular</text>
    <text x="14" y="85" font-size="11" fill="#cbd5e1">  e integración de movimiento.</text>
    <text x="14" y="108" font-size="11.5" font-weight="700" fill="#fdba74">• Esencial para balance energético</text>
    <text x="14" y="126" font-size="11" fill="#94a3b8">  y longevidad metabólica.</text>
  </g>

  <!-- Center: The Plate Visual (Radius 200) -->
  <g id="main_plate" transform="translate(550, 420)">
    <!-- Outer Plate Rim / Shadow -->
    <circle cx="0" cy="0" r="232" fill="#0f172a" stroke="#475569" stroke-width="6" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="222" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="215" fill="#0b1120"/>

    <!-- 1. VEGETALES (Top-Left Quad / ~35% of total plate) -->
    <!-- Wedge from 140 deg to 270 deg (left-top) -->
    <path d="M 0 0 L -138 165 A 215 215 0 0 1 -215 0 A 215 215 0 0 1 0 -215 Z" fill="url(#veggieGrad)" stroke="#0b1120" stroke-width="4"/>
    
    <!-- 2. FRUTAS (Bottom-Left Quad / ~15% of total plate) -->
    <!-- Wedge from 90 deg to 140 deg (left-bottom) -->
    <path d="M 0 0 L 0 215 A 215 215 0 0 1 -138 165 Z" fill="url(#fruitGrad)" stroke="#0b1120" stroke-width="4"/>

    <!-- 3. GRANOS INTEGRALES (Top-Right Quad / 25% of total plate) -->
    <!-- Wedge from 270 deg to 360 deg (top-right) -->
    <path d="M 0 0 L 0 -215 A 215 215 0 0 1 215 0 Z" fill="url(#grainGrad)" stroke="#0b1120" stroke-width="4"/>

    <!-- 4. PROTEÍNA SALUDABLE (Bottom-Right Quad / 25% of total plate) -->
    <!-- Wedge from 0 deg to 90 deg (bottom-right) -->
    <path d="M 0 0 L 215 0 A 215 215 0 0 1 0 215 Z" fill="url(#proteinGrad)" stroke="#0b1120" stroke-width="4"/>

    <!-- Inner Dividers Glow -->
    <circle cx="0" cy="0" r="215" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="#0b1120" stroke="#475569" stroke-width="3"/>
    <text x="0" y="5" font-size="11" font-weight="900" fill="#94a3b8" text-anchor="middle">50 / 50</text>

    <!-- Labels inside Plate Segments -->
    <!-- VEGETALES Label -->
    <g transform="translate(-105, -95)">
      <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#22c55e" stroke-width="1"/>
      <text x="0" y="-8" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">VEGETALES</text>
      <text x="0" y="10" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Mayor Proporción</text>
      <text x="0" y="24" font-size="9.5" font-weight="600" fill="#bbf7d0" text-anchor="middle">Variedad y color</text>
    </g>

    <!-- FRUTAS Label -->
    <g transform="translate(-75, 110)">
      <rect x="-55" y="-22" width="110" height="44" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#fb7185" stroke-width="1"/>
      <text x="0" y="-3" font-size="14" font-weight="900" fill="#fda4af" text-anchor="middle">FRUTAS</text>
      <text x="0" y="14" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">Todas las variedades</text>
    </g>

    <!-- GRANOS INTEGRALES Label -->
    <g transform="translate(100, -95)">
      <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#fbbf24" stroke-width="1"/>
      <text x="0" y="-8" font-size="14" font-weight="900" fill="#fde68a" text-anchor="middle">GRANOS INTEGRALES</text>
      <text x="0" y="10" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">25% DEL PLATO</text>
      <text x="0" y="23" font-size="9.5" fill="#fef08a" text-anchor="middle">Arroz int., quinoa, avena</text>
    </g>

    <!-- PROTEÍNAS SALUDABLES Label -->
    <g transform="translate(100, 100)">
      <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#0f172a" fill-opacity="0.75" stroke="#60a5fa" stroke-width="1"/>
      <text x="0" y="-8" font-size="14" font-weight="900" fill="#93c5fd" text-anchor="middle">PROTEÍNA NOBLE</text>
      <text x="0" y="10" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">25% DEL PLATO</text>
      <text x="0" y="23" font-size="9.5" fill="#bfdbfe" text-anchor="middle">Pescado, ave, legumbres</text>
    </g>
  </g>

  <!-- Right Side: Hydration Glass & Detailed Breakdown Cards -->
  <!-- 1. Water / Hydration (Top-Right) -->
  <g transform="translate(830, 135)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="150" rx="14" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="url(#waterGrad)"/>
    <!-- Glass/Water Icon -->
    <path d="M26 20 h12 l-2 15 a2 2 0 0 1 -2 2 h-4 a2 2 0 0 1 -2 -2 z M27 25 h10" fill="#ffffff"/>
    <text x="56" y="34" font-size="14" font-weight="800" fill="#7dd3fc">AGUA Y BEBIDAS</text>
    <text x="14" y="65" font-size="11.5" font-weight="600" fill="#f8fafc">• Bebe agua, té o café</text>
    <text x="14" y="83" font-size="11" fill="#cbd5e1">  (con poco o sin azúcar).</text>
    <text x="14" y="103" font-size="11.5" font-weight="600" fill="#f87171">• Limitar leche/lácteos (1-2/día)</text>
    <text x="14" y="123" font-size="11.5" font-weight="700" fill="#ef4444">• Evitar bebidas azucaradas.</text>
  </g>

  <!-- 2. Critical Rule / No Potatoes (Bottom-Right) -->
  <g transform="translate(830, 560)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="145" rx="14" fill="url(#cardGrad)" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="#be123c"/>
    <text x="32" y="36" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
    <text x="56" y="34" font-size="13" font-weight="800" fill="#fda4af">REGLA DE HARVARD</text>
    <text x="14" y="65" font-size="11.5" font-weight="700" fill="#ffffff">Las patatas / papas</text>
    <text x="14" y="83" font-size="11" font-weight="600" fill="#fca5a5">NO cuentan como vegetales</text>
    <text x="14" y="103" font-size="10.5" fill="#cbd5e1">por su elevado impacto glucémico</text>
    <text x="14" y="121" font-size="10.5" fill="#94a3b8">(IG &gt; 80 en caliente).</text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="1000" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(30, 26)">
      <circle cx="8" cy="8" r="6" fill="#22c55e"/>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#e2e8f0">50% Hortalizas y Frutas</text>
      <text x="24" y="28" font-size="10" fill="#94a3b8">Fitoquímicos, licopeno, sulforafano</text>
    </g>

    <g transform="translate(280, 26)">
      <circle cx="8" cy="8" r="6" fill="#fbbf24"/>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#e2e8f0">25% Granos Integrales</text>
      <text x="24" y="28" font-size="10" fill="#94a3b8">Fibra intacta, salvado y germen</text>
    </g>

    <g transform="translate(530, 26)">
      <circle cx="8" cy="8" r="6" fill="#3b82f6"/>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#e2e8f0">25% Proteína de Calidad</text>
      <text x="24" y="28" font-size="10" fill="#94a3b8">Pescado azul, aves, legumbres, tofu</text>
    </g>

    <g transform="translate(780, 26)">
      <circle cx="8" cy="8" r="6" fill="#a3e635"/>
      <text x="24" y="12" font-size="12" font-weight="700" fill="#e2e8f0">Grasas &amp; Hidratación</text>
      <text x="24" y="28" font-size="10" fill="#94a3b8">AOVE abundante, agua pura</text>
    </g>
  </g>

  <!-- Footer Legal Traceability -->
  <text x="550" y="810" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">
    Fuente Oficial: Harvard T.H. Chan School of Public Health &amp; Harvard Medical School · Copyright © 2011 Harvard University · TouChef Master Series
  </text>
</svg>
