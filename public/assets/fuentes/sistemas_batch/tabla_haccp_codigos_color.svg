<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad4" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#06080e"/>
    </radialGradient>

    <!-- Card Gradients for the 6 Colors -->
    <!-- 1. RED -->
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1116"/>
      <stop offset="100%" stop-color="#19070a"/>
    </linearGradient>

    <!-- 2. YELLOW -->
    <linearGradient id="yellowCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#36280b"/>
      <stop offset="100%" stop-color="#1a1304"/>
    </linearGradient>

    <!-- 3. BLUE -->
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2942"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>

    <!-- 4. GREEN -->
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2c1d"/>
      <stop offset="100%" stop-color="#04140d"/>
    </linearGradient>

    <!-- 5. WHITE -->
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="100%" stop-color="#131922"/>
    </linearGradient>

    <!-- 6. BROWN -->
    <linearGradient id="brownCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#382115"/>
      <stop offset="100%" stop-color="#190f09"/>
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="720" fill="url(#bgGrad4)" rx="16"/>
  <rect width="1048" height="718" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- HEADER -->
  <g transform="translate(45, 38)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M10 10 L28 10 L28 28 L10 28 Z M10 19 L28 19 M19 10 L19 28" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
    
    <text x="48" y="20" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">CÓDIGO CROMÁTICO DE TABLAS DE CORTE (HACCP / APPCC)</text>
    <text x="48" y="36" fill="#94a3b8" font-size="13" font-weight="400">Estándar Internacional para Anulación de Contaminación Cruzada en Batch Cooking y Manipulación Masiva</text>
  </g>

  <!-- GRID: 6 BOARDS (2 ROWS OF 3) -->
  <!-- ROW 1 -->
  <!-- 1. ROJO: CARNES ROJAS CRUDAS -->
  <g transform="translate(45, 95)" filter="url(#cardGlow)">
    <rect width="300" height="235" rx="12" fill="url(#redCard)" stroke="#ef4444" stroke-width="1.5"/>
    
    <!-- Cutting Board Representation -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 288 0 C 294.63 0, 300 5.37, 300 12 L 300 42 L 0 42 Z" fill="#991b1b"/>
    <circle cx="280" cy="21" r="7" fill="#1e1114" stroke="#ef4444" stroke-width="1.2"/>
    <text x="14" y="27" fill="#fee2e2" font-size="13" font-weight="700">🔴 ROJO: Carnes Rojas Crudas</text>

    <g transform="translate(14, 56)">
      <text x="0" y="0" fill="#fca5a5" font-size="10" font-weight="700">MATRICES AUTORIZADAS:</text>
      <text x="0" y="16" fill="#fecaca" font-size="10">• Vacuno (ternera, buey), Porcino (cerdo)</text>
      <text x="0" y="30" fill="#fecaca" font-size="10">• Ovino / Caprino (cordero, cabrito)</text>
      <text x="0" y="44" fill="#fecaca" font-size="10">• Caza mayor y menor (jabalí, ciervo)</text>

      <line x1="0" y1="56" x2="272" y2="56" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>

      <text x="0" y="70" fill="#f87171" font-size="10" font-weight="700">PATÓGENOS CRÍTICOS:</text>
      <text x="0" y="85" fill="#cbd5e1" font-size="9.5">• <tspan fill="#fca5a5" font-weight="600">Salmonella spp.</tspan>, <tspan fill="#fca5a5" font-weight="600">E. coli O157:H7</tspan></text>
      <text x="0" y="99" fill="#cbd5e1" font-size="9.5">• <tspan fill="#fca5a5" font-weight="600">Yersinia enterocolitica</tspan></text>

      <rect x="0" y="112" width="272" height="24" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
      <text x="136" y="128" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle">⚠️ Prohibido contacto con cocinados</text>
    </g>
  </g>

  <!-- 2. AMARILLO: AVES DE CORRAL CRUDAS -->
  <g transform="translate(375, 95)" filter="url(#cardGlow)">
    <rect width="300" height="235" rx="12" fill="url(#yellowCard)" stroke="#eab308" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 288 0 C 294.63 0, 300 5.37, 300 12 L 300 42 L 0 42 Z" fill="#854d0e"/>
    <circle cx="280" cy="21" r="7" fill="#1a1304" stroke="#eab308" stroke-width="1.2"/>
    <text x="14" y="27" fill="#fef9c3" font-size="13" font-weight="700">🟡 AMARILLO: Aves de Corral Crudas</text>

    <g transform="translate(14, 56)">
      <text x="0" y="0" fill="#fde047" font-size="10" font-weight="700">MATRICES AUTORIZADAS:</text>
      <text x="0" y="16" fill="#fef08a" font-size="10">• Pollo, Pavo, Capón, Pularda</text>
      <text x="0" y="30" fill="#fef08a" font-size="10">• Pato, Oca, Codorniz, Perdiz</text>
      <text x="0" y="44" fill="#fef08a" font-size="10">• Menudillos y despojos de ave crudos</text>

      <line x1="0" y1="56" x2="272" y2="56" stroke="#eab308" stroke-opacity="0.3" stroke-width="1"/>

      <text x="0" y="70" fill="#fbbf24" font-size="10" font-weight="700">PATÓGENOS CRÍTICOS (MÁXIMO RIESGO):</text>
      <text x="0" y="85" fill="#cbd5e1" font-size="9.5">• <tspan fill="#fde047" font-weight="600">Campylobacter jejuni</tspan> (Dosis inf. &lt;500 UFC)</text>
      <text x="0" y="99" fill="#cbd5e1" font-size="9.5">• <tspan fill="#fde047" font-weight="600">Salmonella enteritidis</tspan></text>

      <rect x="0" y="112" width="272" height="24" rx="4" fill="#422006" stroke="#ca8a04" stroke-width="1"/>
      <text x="136" y="128" fill="#fef08a" font-size="9" font-weight="700" text-anchor="middle">⚡ Tabla con mayor tasa de infección cruzada</text>
    </g>
  </g>

  <!-- 3. AZUL: PESCADOS Y MARISCOS CRUDOS -->
  <g transform="translate(705, 95)" filter="url(#cardGlow)">
    <rect width="300" height="235" rx="12" fill="url(#blueCard)" stroke="#0284c7" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 288 0 C 294.63 0, 300 5.37, 300 12 L 300 42 L 0 42 Z" fill="#075985"/>
    <circle cx="280" cy="21" r="7" fill="#06121f" stroke="#0284c7" stroke-width="1.2"/>
    <text x="14" y="27" fill="#e0f2fe" font-size="13" font-weight="700">🔵 AZUL: Pescados y Mariscos Crudos</text>

    <g transform="translate(14, 56)">
      <text x="0" y="0" fill="#7dd3fc" font-size="10" font-weight="700">MATRICES AUTORIZADAS:</text>
      <text x="0" y="16" fill="#bae6fd" font-size="10">• Pescado blanco (merluza, bacalao, lubina)</text>
      <text x="0" y="30" fill="#bae6fd" font-size="10">• Pescado azul (salmón, atún, caballa)</text>
      <text x="0" y="44" fill="#bae6fd" font-size="10">• Crustáceos y moluscos (gambas, pulpo)</text>

      <line x1="0" y1="56" x2="272" y2="56" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>

      <text x="0" y="70" fill="#38bdf8" font-size="10" font-weight="700">PATÓGENOS Y PARÁSITOS CRÍTICOS:</text>
      <text x="0" y="85" fill="#cbd5e1" font-size="9.5">• <tspan fill="#7dd3fc" font-weight="600">Anisakis simplex</tspan> (Congelación oblig. -20°C)</text>
      <text x="0" y="99" fill="#cbd5e1" font-size="9.5">• <tspan fill="#7dd3fc" font-weight="600">Vibrio parahaemolyticus</tspan>, Histamina</text>

      <rect x="0" y="112" width="272" height="24" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="136" y="128" fill="#7dd3fc" font-size="9" font-weight="700" text-anchor="middle">❄️ Respetar cadena de frío a ≤2°C</text>
    </g>
  </g>

  <!-- ROW 2 -->
  <!-- 4. VERDE: FRUTAS Y VEGETALES LIMPIOS -->
  <g transform="translate(45, 345)" filter="url(#cardGlow)">
    <rect width="300" height="235" rx="12" fill="url(#greenCard)" stroke="#10b981" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 288 0 C 294.63 0, 300 5.37, 300 12 L 300 42 L 0 42 Z" fill="#065f46"/>
    <circle cx="280" cy="21" r="7" fill="#04140d" stroke="#10b981" stroke-width="1.2"/>
    <text x="14" y="27" fill="#d1fae5" font-size="13" font-weight="700">🟢 VERDE: Frutas y Verduras Limpias</text>

    <g transform="translate(14, 56)">
      <text x="0" y="0" fill="#6ee7b7" font-size="10" font-weight="700">MATRICES AUTORIZADAS:</text>
      <text x="0" y="16" fill="#a7f3d0" font-size="10">• Hortalizas previamente lavadas</text>
      <text x="0" y="30" fill="#a7f3d0" font-size="10">• Ensaladas listas para consumo (RTE)</text>
      <text x="0" y="44" fill="#a7f3d0" font-size="10">• Frutas frescas, hierbas aromáticas</text>

      <line x1="0" y1="56" x2="272" y2="56" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>

      <text x="0" y="70" fill="#34d399" font-size="10" font-weight="700">PATÓGENOS Y RIESGOS:</text>
      <text x="0" y="85" fill="#cbd5e1" font-size="9.5">• <tspan fill="#6ee7b7" font-weight="600">Listeria monocytogenes</tspan> (en humedad)</text>
      <text x="0" y="99" fill="#cbd5e1" font-size="9.5">• <tspan fill="#6ee7b7" font-weight="600">Norovirus</tspan>, residuos de pesticidas</text>

      <rect x="0" y="112" width="272" height="24" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="136" y="128" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">🥗 Desinfección previa con agua + lejía alimentaria</text>
    </g>
  </g>

  <!-- 5. BLANCO: ALIMENTOS COCINADOS / LÁCTEOS -->
  <g transform="translate(375, 345)" filter="url(#cardGlow)">
    <rect width="300" height="235" rx="12" fill="url(#whiteCard)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 288 0 C 294.63 0, 300 5.37, 300 12 L 300 42 L 0 42 Z" fill="#475569"/>
    <circle cx="280" cy="21" r="7" fill="#131922" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="27" fill="#f8fafc" font-size="13" font-weight="700">⚪ BLANCO: Cocinados, Lácteos y Pan</text>

    <g transform="translate(14, 56)">
      <text x="0" y="0" fill="#cbd5e1" font-size="10" font-weight="700">MATRICES AUTORIZADAS:</text>
      <text x="0" y="16" fill="#e2e8f0" font-size="10">• Carnes/aves asadas cocinadas (RTE)</text>
      <text x="0" y="30" fill="#e2e8f0" font-size="10">• Quesos, embutidos curados/cocidos</text>
      <text x="0" y="44" fill="#e2e8f0" font-size="10">• Pan, bollería, repostería terminada</text>

      <line x1="0" y1="56" x2="272" y2="56" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>

      <text x="0" y="70" fill="#e2e8f0" font-size="10" font-weight="700">ZONA ESTÉRIL (MÁXIMA VIGILANCIA):</text>
      <text x="0" y="85" fill="#cbd5e1" font-size="9.5">• <tspan fill="#f8fafc" font-weight="600">Recontaminación post-térmica</tspan></text>
      <text x="0" y="99" fill="#cbd5e1" font-size="9.5">• <tspan fill="#f8fafc" font-weight="600">Staphylococcus aureus</tspan> (manos de manip.)</text>

      <rect x="0" y="112" width="272" height="24" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="136" y="128" fill="#f8fafc" font-size="9" font-weight="700" text-anchor="middle">🛡️ Cuchillos exclusivos esterilizados</text>
    </g>
  </g>

  <!-- 6. MARRÓN: VEGETALES CON TIERRA / SUCIOS -->
  <g transform="translate(705, 345)" filter="url(#cardGlow)">
    <rect width="300" height="235" rx="12" fill="url(#brownCard)" stroke="#b45309" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 288 0 C 294.63 0, 300 5.37, 300 12 L 300 42 L 0 42 Z" fill="#713f12"/>
    <circle cx="280" cy="21" r="7" fill="#190f09" stroke="#b45309" stroke-width="1.2"/>
    <text x="14" y="27" fill="#fed7aa" font-size="13" font-weight="700">🟤 MARRÓN: Vegetales con Tierra</text>

    <g transform="translate(14, 56)">
      <text x="0" y="0" fill="#fcd34d" font-size="10" font-weight="700">MATRICES AUTORIZADAS:</text>
      <text x="0" y="16" fill="#fde68a" font-size="10">• Tubérculos con tierra (patatas, batatas)</text>
      <text x="0" y="30" fill="#fde68a" font-size="10">• Raíces sin pelar (zanahorias, remolachas)</text>
      <text x="0" y="44" fill="#fde68a" font-size="10">• Puerros sucios, setas silvestres con tierra</text>

      <line x1="0" y1="56" x2="272" y2="56" stroke="#b45309" stroke-opacity="0.3" stroke-width="1"/>

      <text x="0" y="70" fill="#f59e0b" font-size="10" font-weight="700">ESPORAS TELÚRICAS TERMORESISTENTES:</text>
      <text x="0" y="85" fill="#cbd5e1" font-size="9.5">• <tspan fill="#fcd34d" font-weight="600">Clostridium botulinum / perfringens</tspan></text>
      <text x="0" y="99" fill="#cbd5e1" font-size="9.5">• <tspan fill="#fcd34d" font-weight="600">Bacillus cereus</tspan></text>

      <rect x="0" y="112" width="272" height="24" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1"/>
      <text x="136" y="128" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">🌱 Confinada en Zona Sucia / Pelado inicial</text>
    </g>
  </g>

  <!-- BOTTOM TECHNICAL SPECIFICATIONS & AUDIT RULES -->
  <g transform="translate(45, 595)" filter="url(#cardGlow)">
    <rect width="960" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <g transform="translate(20, 18)">
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700">📐 ESPECIFICACIONES TÉCNICAS DEL MATERIAL (HDPE 500 / PP VIRGEN):</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">• <tspan font-weight="600">Composición:</tspan> Polietileno de Alta Densidad (HDPE 500) de grado alimentario conforme a FDA 21 CFR 177.1520 y Reglamento UE 10/2011.</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="10">• <tspan font-weight="600">Criterio de Descarte Inmediato:</tspan> Toda tabla con <tspan fill="#ef4444" font-weight="700">surcos o incisiones &gt; 1.0 mm</tspan> debe rectificarse o desecharse (micro-refugio de biofilm).</text>
      <text x="0" y="46" fill="#cbd5e1" font-size="10">• <tspan font-weight="600">Protocolo L+D Obligatorio:</tspan> Raspado ➔ Prelavado a 40°C ➔ Detergente alcalino ➔ Aclarado ➔ Desinfección clorada ➔ Secado vertical al aire.</text>
    </g>

    <rect x="800" y="20" width="140" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="870" y="42" fill="#c7d2fe" font-size="10" font-weight="700" text-anchor="middle">PROHIBICIÓN</text>
    <text x="870" y="56" fill="#a5b4fc" font-size="9" text-anchor="middle">Madera para Crudos</text>
  </g>
</svg>
