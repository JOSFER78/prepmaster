<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad2" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#06090e"/>
    </radialGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="badCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1114"/>
      <stop offset="100%" stop-color="#130a0d"/>
    </linearGradient>

    <linearGradient id="goodCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1f1d"/>
      <stop offset="100%" stop-color="#061312"/>
    </linearGradient>

    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowIce" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="680" fill="url(#bgGrad2)" rx="16"/>
  <rect width="998" height="678" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- HEADER -->
  <g transform="translate(45, 40)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M19 6 L19 32 M6 19 L32 19 M10 10 L28 28 M10 28 L28 10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    
    <text x="48" y="20" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">TERMODINÁMICA DE LA CRISTALIZACIÓN EN CONGELACIÓN</text>
    <text x="48" y="36" fill="#94a3b8" font-size="13" font-weight="400">Microcristales Esféricos (-24°C / Criocongelación) vs. Macrocristales y Lisis Celular (-5°C a -18°C)</text>
  </g>

  <!-- TOP SUMMARY BANNER: LA ZONA DE MÁXIMA CRISTALIZACIÓN (ZMC) -->
  <g transform="translate(45, 95)" filter="url(#shadowBox)">
    <rect width="910" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#38bdf8" font-size="12" font-weight="700">❄️ LA ZONA CRÍTICA DE MÁXIMA FORMACIÓN DE CRISTALES (ZMC): -1°C a -5°C</text>
    <text x="20" y="44" fill="#cbd5e1" font-size="11">En este intervalo térmico, el 85% del agua libre pasa a fase sólida. La velocidad con la que el alimento cruza la ZMC determina el 100% de la calidad textural final.</text>
    
    <rect x="740" y="14" width="150" height="30" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="815" y="33" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Regla: Δt ZMC ≤ 15 min</text>
  </g>

  <!-- LEFT PANEL: CONGELACIÓN LENTA (MACROCRISTALES / DAÑO) -->
  <g transform="translate(45, 170)" filter="url(#shadowBox)">
    <!-- Container -->
    <rect width="440" height="435" rx="14" fill="url(#badCardGrad)" stroke="#ef4444" stroke-opacity="0.6" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <path d="M 0 14 C 0 6.27, 6.27 0, 14 0 L 426 0 C 433.73 0, 440 6.27, 440 14 L 440 46 L 0 46 Z" fill="#2d1217"/>
    <text x="18" y="28" fill="#fca5a5" font-size="14" font-weight="700">❌ CONGELACIÓN LENTA (Doméstica -5°C a -18°C)</text>
    
    <!-- Metric Row -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" fill="#94a3b8" font-size="11">Tiempo en ZMC (-1°C a -5°C):</text>
      <text x="220" y="0" fill="#ef4444" font-size="11" font-weight="700">> 120 a 240 minutos</text>
      
      <text x="0" y="18" fill="#94a3b8" font-size="11">Tasa de nucleación inicial:</text>
      <text x="220" y="18" fill="#f87171" font-size="11" font-weight="600">Muy Baja (Pocos núcleos)</text>

      <text x="0" y="36" fill="#94a3b8" font-size="11">Velocidad crecimiento cristal:</text>
      <text x="220" y="36" fill="#ef4444" font-size="11" font-weight="700">Extremadamente Alta</text>
    </g>

    <!-- MICROSCOPIC CELLULAR DIAGRAM (SLOW FREEZE) -->
    <!-- Frame for Cell View -->
    <g transform="translate(18, 115)">
      <rect width="404" height="175" rx="8" fill="#0b080a" stroke="#371a1d" stroke-width="1"/>
      <text x="12" y="18" fill="#fca5a5" font-size="10" font-weight="700">ESTRUCTURA HISTOLÓGICA / CELULAR AFECTADA</text>

      <!-- Cell 1: Ruptured Muscle/Plant Cell -->
      <g transform="translate(45, 35)">
        <!-- Broken Cell Wall -->
        <path d="M 10 30 Q 15 10, 50 10 Q 75 10, 80 25 L 85 45 Q 80 75, 45 75 Q 15 75, 10 50 Z" 
              fill="#2e1015" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="45" y="45" fill="#fca5a5" font-size="9" text-anchor="middle">Lisis Membrana</text>

        <!-- Giant Sharp Ice Crystal (Needle like / Acicular) -->
        <polygon points="55,-10 95,40 120,30 110,85 70,60 50,85 35,40" 
                 fill="#38bdf8" fill-opacity="0.85" stroke="#e0f2fe" stroke-width="1.8" filter="url(#glowIce)"/>
        
        <!-- Leakage arrows -->
        <path d="M 25 55 L 5 70 M 20 60 L 0 75" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
        <text x="-5" y="90" fill="#f87171" font-size="8" font-weight="700">Fuga exudado</text>
      </g>

      <!-- Cell 2: Collapsed Cell -->
      <g transform="translate(210, 40)">
        <path d="M 20 20 C 35 5, 80 15, 90 35 C 100 55, 75 80, 50 75 C 25 70, 10 50, 20 20 Z" 
              fill="#240c10" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,2"/>
        
        <!-- Another Big Jagged Crystal puncturing from outside -->
        <polygon points="70,10 135,15 110,65 140,95 85,80 60,110 50,55" 
                 fill="#38bdf8" fill-opacity="0.8" stroke="#bae6fd" stroke-width="1.5" filter="url(#glowIce)"/>
        <text x="45" y="45" fill="#f87171" font-size="8" text-anchor="middle">Colapso</text>
      </g>

      <!-- Crystal Size Callout -->
      <rect x="250" y="130" width="140" height="34" rx="4" fill="#1f1013" stroke="#ef4444" stroke-width="1"/>
      <text x="320" y="144" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle">Macrocristales Extracelulares</text>
      <text x="320" y="157" fill="#f87171" font-size="8" text-anchor="middle">Tamaño: 100 - 300 µm (Microlanzas)</text>
    </g>

    <!-- CONSEQUENCES BULLETS -->
    <g transform="translate(18, 305)">
      <text x="0" y="0" fill="#f87171" font-size="11" font-weight="700">💥 Impacto en el Alimento al Descongelar:</text>
      
      <text x="12" y="18" fill="#fecaca" font-size="10">• <tspan font-weight="700">Pérdida por goteo masiva (Drip Loss):</tspan> 12% a 25% de agua ligada.</text>
      <text x="12" y="34" fill="#fecaca" font-size="10">• <tspan font-weight="700">Degradación textural:</tspan> Pérdida de turgencia, textura correosa/gomosa.</text>
      <text x="12" y="50" fill="#fecaca" font-size="10">• <tspan font-weight="700">Lavado nutricional:</tspan> Pérdida de vitaminas hidrosolubles y mioglobina.</text>
      <text x="12" y="66" fill="#fecaca" font-size="10">• <tspan font-weight="700">Sinéresis severa:</tspan> Rotura irreversible de emulsiones y geles.</text>
    </g>

    <!-- Bottom Status Badge -->
    <rect x="18" y="388" width="404" height="32" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.2"/>
    <text x="220" y="408" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">⚠️ DAÑO HISTOLÓGICO IRREVERSIBLE (LISIS)</text>
  </g>

  <!-- RIGHT PANEL: ULTRACONGELACIÓN RÁPIDA (MICROCRISTALES / PRESERVACIÓN) -->
  <g transform="translate(515, 170)" filter="url(#shadowBox)">
    <!-- Container -->
    <rect width="440" height="435" rx="14" fill="url(#goodCardGrad)" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <path d="M 0 14 C 0 6.27, 6.27 0, 14 0 L 426 0 C 433.73 0, 440 6.27, 440 14 L 440 46 L 0 46 Z" fill="#063223"/>
    <text x="18" y="28" fill="#6ee7b7" font-size="14" font-weight="700">✓ CRIOCONGELACIÓN RÁPIDA (-24°C a -35°C)</text>
    
    <!-- Metric Row -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" fill="#94a3b8" font-size="11">Tiempo en ZMC (-1°C a -5°C):</text>
      <text x="220" y="0" fill="#10b981" font-size="11" font-weight="700">&lt; 15 a 20 minutos (Cruce Flash)</text>
      
      <text x="0" y="18" fill="#94a3b8" font-size="11">Tasa de nucleación inicial:</text>
      <text x="220" y="18" fill="#34d399" font-size="11" font-weight="600">Masiva (Millones de núcleos)</text>

      <text x="0" y="36" fill="#94a3b8" font-size="11">Velocidad crecimiento cristal:</text>
      <text x="220" y="36" fill="#10b981" font-size="11" font-weight="700">Mínima (Cristalización in situ)</text>
    </g>

    <!-- MICROSCOPIC CELLULAR DIAGRAM (FAST FREEZE) -->
    <g transform="translate(18, 115)">
      <rect width="404" height="175" rx="8" fill="#04120f" stroke="#0f3c2e" stroke-width="1"/>
      <text x="12" y="18" fill="#6ee7b7" font-size="10" font-weight="700">ESTRUCTURA HISTOLÓGICA / CELULAR 100% INTACTA</text>

      <!-- Cell 1: Intact Cell with tiny spherical microcrystals inside & outside -->
      <g transform="translate(35, 35)">
        <!-- Perfectly intact cell membrane -->
        <rect x="10" y="10" width="70" height="65" rx="16" fill="#062b1e" stroke="#10b981" stroke-width="2"/>
        <text x="45" y="70" fill="#a7f3d0" font-size="8" text-anchor="middle">Membrana Intacta</text>

        <!-- Tiny spherical microcrystals (intracellular) -->
        <circle cx="28" cy="28" r="4" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="45" cy="25" r="3.5" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="62" cy="30" r="4" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="35" cy="45" r="3.8" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="55" cy="48" r="4.2" fill="#38bdf8" filter="url(#glowIce)"/>
      </g>

      <!-- Cell 2: Intact neighboring cell -->
      <g transform="translate(125, 35)">
        <rect x="10" y="10" width="70" height="65" rx="16" fill="#062b1e" stroke="#10b981" stroke-width="2"/>
        <circle cx="26" cy="32" r="3.5" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="48" cy="24" r="4" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="60" cy="42" r="3.8" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="35" cy="50" r="4" fill="#38bdf8" filter="url(#glowIce)"/>
        <circle cx="52" cy="55" r="3.2" fill="#38bdf8" filter="url(#glowIce)"/>
      </g>

      <!-- Extracellular microcrystals (harmless) -->
      <circle cx="120" cy="55" r="3" fill="#7dd3fc"/>
      <circle cx="120" cy="75" r="3.5" fill="#7dd3fc"/>
      <circle cx="120" cy="95" r="3" fill="#7dd3fc"/>
      <circle cx="30" cy="80" r="3" fill="#7dd3fc"/>

      <!-- Microcrystal Size Callout -->
      <rect x="235" y="130" width="155" height="34" rx="4" fill="#09291e" stroke="#10b981" stroke-width="1"/>
      <text x="312" y="144" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">Microcristales Esféricos</text>
      <text x="312" y="157" fill="#a7f3d0" font-size="8" text-anchor="middle">Tamaño: 5 - 15 µm (Inofensivos)</text>
    </g>

    <!-- ADVANTAGES BULLETS -->
    <g transform="translate(18, 305)">
      <text x="0" y="0" fill="#34d399" font-size="11" font-weight="700">🌟 Beneficios Termodinámicos y Gastronómicos:</text>
      
      <text x="12" y="18" fill="#d1fae5" font-size="10">• <tspan font-weight="700">Exudado nulo (Drip Loss &lt; 1-2%):</tspan> Retención celular total de agua.</text>
      <text x="12" y="34" fill="#d1fae5" font-size="10">• <tspan font-weight="700">Textura crujiente/firme:</tspan> Paredes de celulosa y pectinas intactas.</text>
      <text x="12" y="50" fill="#d1fae5" font-size="10">• <tspan font-weight="700">Retención 100% micronutrientes:</tspan> Sin fuga de sales minerales ni sabor.</text>
      <text x="12" y="66" fill="#d1fae5" font-size="10">• <tspan font-weight="700">Comportamiento en descongelación:</tspan> Reversibilidad hidrodinámica total.</text>
    </g>

    <!-- Bottom Status Badge -->
    <rect x="18" y="388" width="404" height="32" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
    <text x="220" y="408" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">✓ INTEGRIDAD HISTOLÓGICA Y NUTRICIONAL MÁXIMA</text>
  </g>

  <!-- FOOTER -->
  <g transform="translate(45, 642)">
    <text x="0" y="0" fill="#64748b" font-size="11">Principios Bromatológicos: Fennema's Food Chemistry (Cap. 3: Water &amp; Ice) • ASHRAE Refrigeration Manual • TouChef Cryo-Standard</text>
  </g>
</svg>
