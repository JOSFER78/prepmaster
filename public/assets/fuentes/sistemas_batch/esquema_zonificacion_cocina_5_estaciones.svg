<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad3" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>

    <!-- Station Gradients -->
    <linearGradient id="st1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="st2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="st3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="st4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="st5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="shadowSt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="700" fill="url(#bgGrad3)" rx="16"/>
  <rect width="1048" height="698" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- HEADER -->
  <g transform="translate(45, 38)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M8 12 L18 6 L28 12 L28 26 L18 32 L8 26 Z M18 6 L18 32 M8 12 L28 26 M8 26 L28 12" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    
    <text x="48" y="20" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">ESQUEMA DE ZONIFICACIÓN ERGONÓMICA Y ARQUITECTURA DE PRODUCCIÓN</text>
    <text x="48" y="36" fill="#94a3b8" font-size="13" font-weight="400">Flujo Lineal de las 5 Estaciones de Trabajo: Principio de Marcha Hacia Adelante y Concurrencia</text>
  </g>

  <!-- MARCH FORWARD MASTER FLOW ARROW (TOP BANNER) -->
  <g transform="translate(45, 92)" filter="url(#shadowSt)">
    <rect width="960" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="700">PRINCIPIO DE MARCHA HACIA ADELANTE:</text>
    <text x="280" y="28" fill="#94a3b8" font-size="11">Área Sucia/Recepción  ──▶  Área Corte Limpio  ──▶  Transformación Térmica  ──▶  Abatimiento Rápido  ──▶  Envasado Estéril</text>
    
    <rect x="850" y="10" width="95" height="28" rx="5" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="897" y="28" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">✓ CERO RETROCESO</text>
  </g>

  <!-- THE 5 STATIONS (CARDS) -->
  <!-- ESTACIÓN 1: CORTE Y MISE EN PLACE -->
  <g transform="translate(45, 158)" filter="url(#shadowSt)">
    <rect width="180" height="440" rx="12" fill="url(#st1Grad)" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Top Header Tab -->
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 168 0 C 174.63 0, 180 5.37, 180 12 L 180 50 L 0 50 Z" fill="#0c4a6e"/>
    <text x="14" y="22" fill="#7dd3fc" font-size="10" font-weight="700">ESTACIÓN 1</text>
    <text x="14" y="40" fill="#f0f9ff" font-size="12" font-weight="700">Corte y Mise en Place</text>
    
    <g transform="translate(12, 65)">
      <text x="0" y="0" fill="#38bdf8" font-size="10" font-weight="700">🛠️ EQUIPAMIENTO:</text>
      <text x="0" y="15" fill="#cbd5e1" font-size="9.5">• Tablas HDPE 500 (Color)</text>
      <text x="0" y="30" fill="#cbd5e1" font-size="9.5">• Cuchillo Chef + Pelador</text>
      <text x="0" y="45" fill="#cbd5e1" font-size="9.5">• Báscula de precisión 0.1g</text>
      <text x="0" y="60" fill="#cbd5e1" font-size="9.5">• Boles Inox Gastronorm</text>
      <text x="0" y="75" fill="#cbd5e1" font-size="9.5">• Bol de residuos/mermas</text>
      
      <line x1="0" y1="90" x2="156" y2="90" stroke="#0369a1" stroke-opacity="0.4" stroke-width="1"/>
      
      <text x="0" y="106" fill="#38bdf8" font-size="10" font-weight="700">⚙️ TAREAS CLAVE:</text>
      <text x="0" y="122" fill="#e0f2fe" font-size="9">• Lavado y desinfección</text>
      <text x="0" y="136" fill="#e0f2fe" font-size="9">• Cortes geométricos</text>
      <text x="0" y="150" fill="#e0f2fe" font-size="9">• Porcionado crudo</text>
      <text x="0" y="164" fill="#e0f2fe" font-size="9">• Pesaje consolidado</text>

      <line x1="0" y1="180" x2="156" y2="180" stroke="#0369a1" stroke-opacity="0.4" stroke-width="1"/>

      <text x="0" y="196" fill="#38bdf8" font-size="10" font-weight="700">⏱️ TIMING T-120:</text>
      <text x="0" y="212" fill="#7dd3fc" font-size="10" font-weight="700">00:00 - 00:20 (Fase 1)</text>
      <text x="0" y="226" fill="#94a3b8" font-size="9">Corte masivo previo</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="10" y="395" width="160" height="32" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="90" y="415" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">Input: Materia Prima</text>
  </g>

  <!-- ESTACIÓN 2: FUEGOS Y PLACA -->
  <g transform="translate(240, 158)" filter="url(#shadowSt)">
    <rect width="180" height="440" rx="12" fill="url(#st2Grad)" stroke="#d97706" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 168 0 C 174.63 0, 180 5.37, 180 12 L 180 50 L 0 50 Z" fill="#78350f"/>
    <text x="14" y="22" fill="#fcd34d" font-size="10" font-weight="700">ESTACIÓN 2</text>
    <text x="14" y="40" fill="#fffbeb" font-size="12" font-weight="700">Fuegos y Placa Térmica</text>
    
    <g transform="translate(12, 65)">
      <text x="0" y="0" fill="#fbbf24" font-size="10" font-weight="700">🛠️ EQUIPAMIENTO:</text>
      <text x="0" y="15" fill="#cbd5e1" font-size="9.5">• Placa Inducción 3-4 zonas</text>
      <text x="0" y="30" fill="#cbd5e1" font-size="9.5">• Sartenes Inox Tri-Ply</text>
      <text x="0" y="45" fill="#cbd5e1" font-size="9.5">• Olla a presión express</text>
      <text x="0" y="60" fill="#cbd5e1" font-size="9.5">• Cazuela de hierro fundido</text>
      <text x="0" y="75" fill="#cbd5e1" font-size="9.5">• Pinzas inox y espátulas</text>
      
      <line x1="0" y1="90" x2="156" y2="90" stroke="#d97706" stroke-opacity="0.4" stroke-width="1"/>
      
      <text x="0" y="106" fill="#fbbf24" font-size="10" font-weight="700">⚙️ TAREAS CLAVE:</text>
      <text x="0" y="122" fill="#fef3c7" font-size="9">• Salteado y Maillard</text>
      <text x="0" y="136" fill="#fef3c7" font-size="9">• Cocción cereales/arroz</text>
      <text x="0" y="150" fill="#fef3c7" font-size="9">• Reducción de salsas</text>
      <text x="0" y="164" fill="#fef3c7" font-size="9">• Guisado a presión</text>

      <line x1="0" y1="180" x2="156" y2="180" stroke="#d97706" stroke-opacity="0.4" stroke-width="1"/>

      <text x="0" y="196" fill="#fbbf24" font-size="10" font-weight="700">⏱️ TIMING T-120:</text>
      <text x="0" y="212" fill="#fde68a" font-size="10" font-weight="700">00:20 - 01:30 (Fase 2-3)</text>
      <text x="0" y="226" fill="#94a3b8" font-size="9">3 zonas activas simult.</text>
    </g>

    <rect x="10" y="395" width="160" height="32" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1"/>
    <text x="90" y="415" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">Cocción Directa / Placa</text>
  </g>

  <!-- ESTACIÓN 3: HORNO Y ASADOS -->
  <g transform="translate(435, 158)" filter="url(#shadowSt)">
    <rect width="180" height="440" rx="12" fill="url(#st3Grad)" stroke="#e11d48" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 168 0 C 174.63 0, 180 5.37, 180 12 L 180 50 L 0 50 Z" fill="#881337"/>
    <text x="14" y="22" fill="#fda4af" font-size="10" font-weight="700">ESTACIÓN 3</text>
    <text x="14" y="40" fill="#fff1f2" font-size="12" font-weight="700">Horno y Asados (Roast)</text>
    
    <g transform="translate(12, 65)">
      <text x="0" y="0" fill="#fb7185" font-size="10" font-weight="700">🛠️ EQUIPAMIENTO:</text>
      <text x="0" y="15" fill="#cbd5e1" font-size="9.5">• Horno con Convección</text>
      <text x="0" y="30" fill="#cbd5e1" font-size="9.5">• Bandejas GN 1/1 aluminio</text>
      <text x="0" y="45" fill="#cbd5e1" font-size="9.5">• Papel vegetal / Silpat</text>
      <text x="0" y="60" fill="#cbd5e1" font-size="9.5">• Sonda térmica digital</text>
      <text x="0" y="75" fill="#cbd5e1" font-size="9.5">• Rejilla de aireación</text>
      
      <line x1="0" y1="90" x2="156" y2="90" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1"/>
      
      <text x="0" y="106" fill="#fb7185" font-size="10" font-weight="700">⚙️ TAREAS CLAVE:</text>
      <text x="0" y="122" fill="#ffe4e6" font-size="9">• Asado concurrente 3 niv.</text>
      <text x="0" y="136" fill="#ffe4e6" font-size="9">• Tostado frutos secos</text>
      <text x="0" y="150" fill="#ffe4e6" font-size="9">• Tubérculos al vapor/horno</text>
      <text x="0" y="164" fill="#ffe4e6" font-size="9">• Cocción pasiva (manos lib)</text>

      <line x1="0" y1="180" x2="156" y2="180" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1"/>

      <text x="0" y="196" fill="#fb7185" font-size="10" font-weight="700">⏱️ TIMING T-120:</text>
      <text x="0" y="212" fill="#fecdd3" font-size="10" font-weight="700">00:15 - 01:25 (Fase Pasiva)</text>
      <text x="0" y="226" fill="#94a3b8" font-size="9">Carga masiva multialimento</text>
    </g>

    <rect x="10" y="395" width="160" height="32" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1"/>
    <text x="90" y="415" fill="#fecdd3" font-size="10" font-weight="700" text-anchor="middle">Cocción Pasiva Masiva</text>
  </g>

  <!-- ESTACIÓN 4: ROBOT Y TRITURADO -->
  <g transform="translate(630, 158)" filter="url(#shadowSt)">
    <rect width="180" height="440" rx="12" fill="url(#st4Grad)" stroke="#8b5cf6" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 168 0 C 174.63 0, 180 5.37, 180 12 L 180 50 L 0 50 Z" fill="#4c1d95"/>
    <text x="14" y="22" fill="#c4b5fd" font-size="10" font-weight="700">ESTACIÓN 4</text>
    <text x="14" y="40" fill="#f5f3ff" font-size="12" font-weight="700">Robot y Triturado (Hub)</text>
    
    <g transform="translate(12, 65)">
      <text x="0" y="0" fill="#a78bfa" font-size="10" font-weight="700">🛠️ EQUIPAMIENTO:</text>
      <text x="0" y="15" fill="#cbd5e1" font-size="9.5">• Robot Multifunción / Tmx</text>
      <text x="0" y="30" fill="#cbd5e1" font-size="9.5">• Batidora Inmersión (Brazo)</text>
      <text x="0" y="45" fill="#cbd5e1" font-size="9.5">• Procesador de cuchillas</text>
      <text x="0" y="60" fill="#cbd5e1" font-size="9.5">• Vaso medidor alto</text>
      <text x="0" y="75" fill="#cbd5e1" font-size="9.5">• Espátula silicona suave</text>
      
      <line x1="0" y1="90" x2="156" y2="90" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      
      <text x="0" y="106" fill="#a78bfa" font-size="10" font-weight="700">⚙️ TAREAS CLAVE:</text>
      <text x="0" y="122" fill="#ede9fe" font-size="9">• Cremas y purés aterciop.</text>
      <text x="0" y="136" fill="#ede9fe" font-size="9">• Emulsión de vinagretas</text>
      <text x="0" y="150" fill="#ede9fe" font-size="9">• Pestos y marinadas</text>
      <text x="0" y="164" fill="#ede9fe" font-size="9">• Picado flash aromáticos</text>

      <line x1="0" y1="180" x2="156" y2="180" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>

      <text x="0" y="196" fill="#a78bfa" font-size="10" font-weight="700">⏱️ TIMING T-120:</text>
      <text x="0" y="212" fill="#ddd6fe" font-size="10" font-weight="700">01:15 - 01:45 (Fase 4)</text>
      <text x="0" y="226" fill="#94a3b8" font-size="9">Texturizado en serie</text>
    </g>

    <rect x="10" y="395" width="160" height="32" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
    <text x="90" y="415" fill="#ddd6fe" font-size="10" font-weight="700" text-anchor="middle">Texturizado y Emulsión</text>
  </g>

  <!-- ESTACIÓN 5: ABATIMIENTO Y ENVASADO -->
  <g transform="translate(825, 158)" filter="url(#shadowSt)">
    <rect width="180" height="440" rx="12" fill="url(#st5Grad)" stroke="#059669" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 168 0 C 174.63 0, 180 5.37, 180 12 L 180 50 L 0 50 Z" fill="#064e3b"/>
    <text x="14" y="22" fill="#6ee7b7" font-size="10" font-weight="700">ESTACIÓN 5</text>
    <text x="14" y="40" fill="#ecfdf5" font-size="12" font-weight="700">Abatimiento y Envasado</text>
    
    <g transform="translate(12, 65)">
      <text x="0" y="0" fill="#34d399" font-size="10" font-weight="700">🛠️ EQUIPAMIENTO:</text>
      <text x="0" y="15" fill="#cbd5e1" font-size="9.5">• Baño Criogénico Hielo/Sal</text>
      <text x="0" y="30" fill="#cbd5e1" font-size="9.5">• Envasadora Vacío (Camp)</text>
      <text x="0" y="45" fill="#cbd5e1" font-size="9.5">• Recipientes Borosilicato</text>
      <text x="0" y="60" fill="#cbd5e1" font-size="9.5">• Báscula de porciones</text>
      <text x="0" y="75" fill="#cbd5e1" font-size="9.5">• Etiquetas bromatológicas</text>
      
      <line x1="0" y1="90" x2="156" y2="90" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
      
      <text x="0" y="106" fill="#34d399" font-size="10" font-weight="700">⚙️ TAREAS CLAVE:</text>
      <text x="0" y="122" fill="#d1fae5" font-size="9">• Choque térmico forzado</text>
      <text x="0" y="136" fill="#d1fae5" font-size="9">• Porcionado milimétrico</text>
      <text x="0" y="150" fill="#d1fae5" font-size="9">• Extracción O2 / Vacío</text>
      <text x="0" y="164" fill="#d1fae5" font-size="9">• Etiquetado APPCC</text>

      <line x1="0" y1="180" x2="156" y2="180" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>

      <text x="0" y="196" fill="#34d399" font-size="10" font-weight="700">⏱️ TIMING T-120:</text>
      <text x="0" y="212" fill="#a7f3d0" font-size="10" font-weight="700">01:40 - 02:00 (Fase 5)</text>
      <text x="0" y="226" fill="#94a3b8" font-size="9">Cierre higiénico hermético</text>
    </g>

    <rect x="10" y="395" width="160" height="32" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="90" y="415" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">Output: Stock Semanal</text>
  </g>

  <!-- INTER-STATION CONNECTORS -->
  <!-- Est 1 to Est 2 -->
  <path d="M 225 320 L 238 320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowHead)"/>
  <!-- Est 1 to Est 3 -->
  <path d="M 225 240 C 230 200, 420 200, 433 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowHead)"/>
  <!-- Est 2 & 3 to Est 4 -->
  <path d="M 420 320 L 433 320" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowHead)"/>
  <path d="M 615 320 L 628 320" stroke="#fb7185" stroke-width="2" marker-end="url(#arrowHead)"/>
  <!-- Est 4 to Est 5 -->
  <path d="M 810 320 L 823 320" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- FOOTER BANNER: REGLAS DE ORO ERGONÓMICAS -->
  <g transform="translate(45, 615)" filter="url(#shadowSt)">
    <rect width="960" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" fill="#e2e8f0" font-size="11">
      <tspan fill="#38bdf8" font-weight="700">Regla Kaizen:</tspan> Limpieza continua en tiempo real (Clean-As-You-Go) • <tspan fill="#fbbf24" font-weight="700">Triángulo Ergonómico:</tspan> &lt;2 pasos entre zonas • <tspan fill="#34d399" font-weight="700">Seguridad:</tspan> Cero cruce entre crudo y cocinado
    </text>
  </g>
</svg>
