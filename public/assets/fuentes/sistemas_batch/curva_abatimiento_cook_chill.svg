<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
    
    <!-- Danger Zone Red Gradient -->
    <linearGradient id="dangerZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Safe Zone Green Gradient -->
    <linearGradient id="safeZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Fast Curve Gradient -->
    <linearGradient id="fastCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Slow Curve Gradient -->
    <linearGradient id="slowCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow Filter for curves -->
    <filter id="glowFast" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="650" fill="url(#bgGrad)" rx="16"/>
  <rect width="998" height="648" x="1" y="1" fill="none" stroke="#1f293d" stroke-width="2" rx="15"/>

  <!-- HEADER -->
  <g transform="translate(45, 42)">
    <!-- Header Icon -->
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M19 8 L19 26 M13 14 L19 8 L25 14 M12 28 L26 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="48" y="20" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">CURVA DE ABATIMIENTO TÉRMICO COOK &amp; CHILL</text>
    <text x="48" y="36" fill="#94a3b8" font-size="13" font-weight="400">Descenso Rápido Forzado (Baño de Hielo / Criogénico) vs. Enfriamiento Lento Espontáneo (Peligro Bromatológico)</text>
  </g>

  <!-- CHART GRID & AXES -->
  <g transform="translate(0, 0)">
    <!-- Danger Zone Area (65°C at y=260 down to 10°C at y=480) -->
    <rect x="100" y="260" width="620" height="220" fill="url(#dangerZoneGrad)"/>
    
    <!-- Safe Storage Zone (0°C to 10°C, y=480 to y=520) -->
    <rect x="100" y="480" width="620" height="40" fill="url(#safeZoneGrad)"/>

    <!-- Grid Horizontal Lines & Y-Labels -->
    <!-- 100°C -->
    <line x1="100" y1="120" x2="720" y2="120" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="90" y="125" fill="#64748b" font-size="12" font-weight="600" text-anchor="end">100°C</text>

    <!-- 80°C -->
    <line x1="100" y1="200" x2="720" y2="200" stroke="#1e293b" stroke-width="1"/>
    <text x="90" y="205" fill="#64748b" font-size="12" text-anchor="end">80°C</text>

    <!-- 75°C (Pasteurización / Límite PCC 3) -->
    <line x1="100" y1="220" x2="720" y2="220" stroke="#eab308" stroke-dasharray="4,4" stroke-width="1.2"/>
    <text x="90" y="225" fill="#eab308" font-size="12" font-weight="700" text-anchor="end">75°C</text>
    <text x="728" y="224" fill="#eab308" font-size="11" font-weight="600">PCC 3: Cocción Núcleo</text>

    <!-- 65°C (Límite Superior Zona Peligro) -->
    <line x1="100" y1="260" x2="720" y2="260" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="265" fill="#ef4444" font-size="12" font-weight="700" text-anchor="end">65°C</text>
    <text x="728" y="264" fill="#ef4444" font-size="11" font-weight="600">Límite Superior Zona Peligro</text>

    <!-- 40°C (Pico de Crecimiento Bacteriano) -->
    <line x1="100" y1="360" x2="720" y2="360" stroke="#ef4444" stroke-dasharray="2,4" stroke-width="1"/>
    <text x="90" y="365" fill="#f87171" font-size="12" text-anchor="end">40°C</text>
    <text x="728" y="364" fill="#f87171" font-size="11" font-style="italic">Pico proliferación (37-43°C)</text>

    <!-- 20°C (Tª Ambiente) -->
    <line x1="100" y1="440" x2="720" y2="440" stroke="#1e293b" stroke-width="1"/>
    <text x="90" y="445" fill="#64748b" font-size="12" text-anchor="end">20°C</text>

    <!-- 10°C (Límite Abatimiento Fase 1 / Salida Peligro) -->
    <line x1="100" y1="480" x2="720" y2="480" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="485" fill="#10b981" font-size="12" font-weight="700" text-anchor="end">10°C</text>
    <text x="728" y="484" fill="#10b981" font-size="11" font-weight="600">Límite Salida Zona Peligro</text>

    <!-- 4°C (Refrigeración Segura) -->
    <line x1="100" y1="504" x2="720" y2="504" stroke="#06b6d4" stroke-dasharray="3,3" stroke-width="1.2"/>
    <text x="90" y="508" fill="#06b6d4" font-size="12" font-weight="600" text-anchor="end">4°C</text>
    <text x="728" y="508" fill="#06b6d4" font-size="11" font-weight="600">Refrigeración Segura (0-4°C)</text>

    <!-- 0°C (Eje X Base) -->
    <line x1="100" y1="520" x2="720" y2="520" stroke="#475569" stroke-width="2"/>
    <text x="90" y="525" fill="#94a3b8" font-size="12" text-anchor="end">0°C</text>

    <!-- Danger Zone Watermark / Label -->
    <g transform="translate(360, 310)">
      <rect x="-140" y="-16" width="280" height="32" rx="6" fill="#1e1520" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="5" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">⚠️ ZONA DE PELIGRO BROMATOLÓGICO (10°C - 65°C)</text>
    </g>

    <!-- Safe Zone Label -->
    <text x="410" y="502" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">ZONA SEGURA DE ALMACENAMIENTO REFRIGERADO (≤ 4°C)</text>

    <!-- X-Grid & Labels (Minutes) -->
    <line x1="100" y1="120" x2="100" y2="525" stroke="#475569" stroke-width="2"/>
    <text x="100" y="542" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">0'</text>

    <line x1="177.5" y1="120" x2="177.5" y2="520" stroke="#1e293b" stroke-width="1"/>
    <text x="177.5" y="542" fill="#64748b" font-size="12" text-anchor="middle">30'</text>

    <line x1="255" y1="120" x2="255" y2="520" stroke="#1e293b" stroke-width="1"/>
    <text x="255" y="542" fill="#64748b" font-size="12" text-anchor="middle">60'</text>

    <!-- 90 min -> x=332.5 (Objetivo TouChef / Hard Limit) -->
    <line x1="332.5" y1="120" x2="332.5" y2="520" stroke="#06b6d4" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="332.5" y="542" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">90'</text>
    <rect x="282.5" y="130" width="100" height="20" rx="4" fill="#0c2340" stroke="#0284c7" stroke-width="1"/>
    <text x="332.5" y="144" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">🎯 Meta TouChef</text>

    <!-- 120 min -> x=410 (Límite Legal APPCC / HACCP) -->
    <line x1="410" y1="120" x2="410" y2="520" stroke="#eab308" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="410" y="542" fill="#eab308" font-size="12" font-weight="700" text-anchor="middle">120'</text>
    <rect x="355" y="155" width="110" height="20" rx="4" fill="#2d2208" stroke="#ca8a04" stroke-width="1"/>
    <text x="410" y="169" fill="#fde047" font-size="10" font-weight="700" text-anchor="middle">⚖️ Límite Legal APPCC</text>

    <line x1="565" y1="120" x2="565" y2="520" stroke="#1e293b" stroke-width="1"/>
    <text x="565" y="542" fill="#64748b" font-size="12" text-anchor="middle">180'</text>

    <line x1="720" y1="120" x2="720" y2="525" stroke="#475569" stroke-width="2"/>
    <text x="720" y="542" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">240'</text>
    
    <text x="410" y="565" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">Tiempo Transcurrido (Minutos)</text>
  </g>

  <!-- THE CURVES -->
  <!-- CURVA 2: ENFRIAMIENTO LENTO A TEMPERATURA AMBIENTE (Peligro) -->
  <path d="M 100 220 C 140 230, 180 260, 255 295 C 330 330, 410 365, 565 410 C 640 422, 690 428, 720 430" 
        fill="none" stroke="url(#slowCurveGrad)" stroke-width="4" stroke-dasharray="6,3"/>

  <!-- Slow curve markers and callout -->
  <circle cx="255" cy="295" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <circle cx="410" cy="365" r="6" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="720" cy="430" r="5" fill="#991b1b" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Critical Warning Box for Slow Cooling -->
  <g transform="translate(470, 345)" filter="url(#cardShadow)">
    <rect width="210" height="60" rx="8" fill="#1c1117" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="20" fill="#ef4444" font-size="12" font-weight="700">❌ ENFRIAMIENTO AMBIENTE</text>
    <text x="12" y="36" fill="#fca5a5" font-size="10">>240 min en Zona de Peligro</text>
    <text x="12" y="50" fill="#f87171" font-size="10" font-weight="600">Germinación masiva de esporas</text>
  </g>

  <!-- CURVA 1: ABATIMIENTO RÁPIDO FORZADO TOUCHEF (Cook & Chill) -->
  <path d="M 100 220 C 120 280, 140 370, 177.5 405 C 215 440, 235 465, 255 480 C 280 498, 305 504, 332.5 506 L 720 508" 
        fill="none" stroke="url(#fastCurveGrad)" stroke-width="4.5" filter="url(#glowFast)"/>

  <!-- Fast curve markers -->
  <circle cx="100" cy="220" r="6" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <circle cx="177.5" cy="405" r="5" fill="#06b6d4" stroke="#fff" stroke-width="1.5"/>
  <circle cx="255" cy="480" r="7" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <circle cx="332.5" cy="506" r="6" fill="#34d399" stroke="#fff" stroke-width="2"/>

  <!-- Success Callout for Fast Chill -->
  <g transform="translate(145, 435)" filter="url(#cardShadow)">
    <rect width="190" height="52" rx="8" fill="#06281e" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="18" fill="#34d399" font-size="11" font-weight="700">✓ ABATIMIENTO TOUCHEF</text>
    <text x="12" y="32" fill="#a7f3d0" font-size="10">65°C → &lt;10°C en solo 60 min</text>
    <text x="12" y="45" fill="#6ee7b7" font-size="9" font-weight="600">Alcanza ≤4°C a los 80 min (Baño Hielo)</text>
  </g>

  <!-- RIGHT SIDEBAR: TECHNICAL SPECS CARD -->
  <g transform="translate(745, 120)" filter="url(#cardShadow)">
    <rect width="215" height="400" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 203 0 C 209.63 0, 215 5.37, 215 12 L 215 45 L 0 45 Z" fill="#1e293b"/>
    <text x="15" y="28" fill="#f8fafc" font-size="13" font-weight="700">BROMATOLOGÍA APLICADA</text>
    
    <!-- Section 1: Termodinámica del Agua vs Aire -->
    <g transform="translate(14, 60)">
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700">⚡ Conductividad Térmica (k)</text>
      <text x="0" y="16" fill="#cbd5e1" font-size="10">Agua líquida: <tspan fill="#38bdf8" font-weight="700">0.58 W/m·K</tspan></text>
      <text x="0" y="30" fill="#cbd5e1" font-size="10">Aire estático: <tspan fill="#f87171" font-weight="700">0.024 W/m·K</tspan></text>
      <rect x="0" y="38" width="187" height="24" rx="4" fill="#0b1b2b" stroke="#0369a1" stroke-width="1"/>
      <text x="93" y="54" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">El agua enfría 24x más rápido</text>
    </g>

    <!-- Divider -->
    <line x1="14" y1="135" x2="201" y2="135" stroke="#334155" stroke-width="1"/>

    <!-- Section 2: Microorganismos Diana -->
    <g transform="translate(14, 150)">
      <text x="0" y="0" fill="#f43f5e" font-size="11" font-weight="700">🦠 Microorganismos Críticos</text>
      
      <text x="0" y="16" fill="#e2e8f0" font-size="10" font-weight="600">• Clostridium perfringens</text>
      <text x="10" y="28" fill="#94a3b8" font-size="9">Duplicación en 10 min a 43°C</text>

      <text x="0" y="44" fill="#e2e8f0" font-size="10" font-weight="600">• Bacillus cereus</text>
      <text x="10" y="56" fill="#94a3b8" font-size="9">Toxina emética termorresistente</text>

      <text x="0" y="72" fill="#e2e8f0" font-size="10" font-weight="600">• Salmonella enterica</text>
      <text x="10" y="84" fill="#94a3b8" font-size="9">Rango activo: 7°C a 48°C</text>
    </g>

    <!-- Divider -->
    <line x1="14" y1="250" x2="201" y2="250" stroke="#334155" stroke-width="1"/>

    <!-- Section 3: Protocolo TouChef -->
    <g transform="translate(14, 265)">
      <text x="0" y="0" fill="#10b981" font-size="11" font-weight="700">📋 Protocolo Baño Criogénico</text>
      <text x="0" y="16" fill="#cbd5e1" font-size="10">1. Proporción 1:1 Agua/Hielo</text>
      <text x="0" y="30" fill="#cbd5e1" font-size="10">2. Adición 100g sal gruesa</text>
      <text x="0" y="44" fill="#cbd5e1" font-size="10">3. Contenedores Gastronorm inox</text>
      <text x="0" y="58" fill="#cbd5e1" font-size="10">4. Remover cada 10-15 min</text>
      <text x="0" y="72" fill="#34d399" font-size="10" font-weight="700">5. Entrada a frío &lt; 8°C</text>
    </g>

    <!-- Status Badge Bottom -->
    <rect x="14" y="355" width="187" height="32" rx="6" fill="#042f2e" stroke="#059669" stroke-width="1.2"/>
    <text x="107" y="375" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">✓ ESTÁNDAR APPCC / HACCP</text>
  </g>

  <!-- FOOTER -->
  <g transform="translate(45, 605)">
    <text x="0" y="0" fill="#64748b" font-size="11">Fuente Normativa: Reglamento CE 852/2004 • Directrices Codex Alimentarius CAC/GL 21-1997 • TouChef Culinary Lab</text>
  </g>
</svg>
