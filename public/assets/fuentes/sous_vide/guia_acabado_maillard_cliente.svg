<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#18100c" />
      <stop offset="100%" stop-color="#050302" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241711" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#140b07" stop-opacity="0.95" />
    </linearGradient>

    <!-- Golden & Ember Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Meat Gradients: Traditional vs Sous-Vide -->
    <!-- Traditional: Grey-brown edges, tiny pink center -->
    <linearGradient id="meatTradGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3728" />
      <stop offset="18%" stop-color="#6b5344" />
      <stop offset="35%" stop-color="#9a6b5a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="65%" stop-color="#9a6b5a" />
      <stop offset="82%" stop-color="#6b5344" />
      <stop offset="100%" stop-color="#4a3728" />
    </linearGradient>

    <!-- TouChef Perfect Sous-Vide: 1mm crispy crust, 98% uniform juicy pink/red -->
    <linearGradient id="meatSousVideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3e2312" />
      <stop offset="2%" stop-color="#854d0e" />
      <stop offset="4%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="96%" stop-color="#e11d48" />
      <stop offset="98%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#3e2312" />
    </linearGradient>

    <filter id="cardShadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; fill: #d97706; }
    .badge { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 11px; font-weight: 600; }
    .card-title { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #fed7aa; }
    .card-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #cbd5e1; line-height: 1.45; }
    .step-num { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; }
    .vs-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="1050" height="620" fill="url(#bgGrad5)" />

  <!-- Outer Frame -->
  <rect x="15" y="15" width="1020" height="590" rx="12" fill="none" stroke="#451a03" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#ea580c" fill-opacity="0.25" stroke="#ea580c" stroke-width="1" />
    <path d="M12 24 C14 18, 16 14, 20 10 C21 14, 24 16, 26 24 C24 28, 14 28, 12 24 Z" fill="#f97316" />

    <text x="48" y="18" class="title">GUÍA DE ACABADO MAILLARD &amp; REGENERACIÓN EXPRESS (TOUCHEF CLIENT MANUAL)</text>
    <text x="48" y="34" class="subtitle">Tu Menú de Restaurante con Estrella Michelin en 5 Minutos: Reacción de Maillard a 150°C - 165°C</text>

    <!-- Tag Standard -->
    <rect x="800" y="4" width="170" height="24" rx="12" fill="#431407" stroke="#ea580c" stroke-width="1" />
    <circle cx="814" cy="16" r="4" fill="#f97316" />
    <text x="824" y="20" class="badge" fill="#fdba74">45 SEG MAILLARD</text>
  </g>

  <!-- Top: 4 Step-by-Step Action Cards (Width 225 each, Total 4 * 225 + 3 * 16.6 = 950) -->
  <g transform="translate(50, 95)">
    
    <!-- STEP 1 -->
    <g transform="translate(0, 0)">
      <rect width="225" height="175" rx="8" fill="url(#cardGrad5)" stroke="#7c2d12" stroke-width="1" filter="url(#cardShadow5)" />
      <!-- Step circle -->
      <circle cx="28" cy="28" r="14" fill="#ea580c" />
      <text x="28" y="33" class="step-num" text-anchor="middle">1</text>

      <text x="50" y="24" class="card-title">TEMPLAR EN BOLSA</text>
      <text x="50" y="38" class="badge" fill="#f97316" font-size="9.5">⏱ 4 - 5 MINUTOS</text>

      <line x1="12" y1="50" x2="213" y2="50" stroke="#431407" stroke-width="1" />

      <text x="12" y="70" class="card-text">Sumerge la bolsa cerrada en</text>
      <text x="12" y="86" class="card-text">un cazo o bol con agua muy</text>
      <text x="12" y="102" class="card-text">caliente del grifo (<tspan fill="#fed7aa" font-weight="700">55–60°C</tspan>).</text>
      
      <rect x="12" y="118" width="201" height="44" rx="4" fill="#431407" fill-opacity="0.6" stroke="#9a3412" stroke-width="0.5" />
      <text x="18" y="133" class="badge" fill="#fdba74" font-size="9">✔ Recupera el núcleo térmico</text>
      <text x="18" y="149" class="badge" fill="#fdba74" font-size="9">✔ Cero riesgo de sobrecocción</text>
    </g>

    <!-- STEP 2 -->
    <g transform="translate(241.6, 0)">
      <rect width="225" height="175" rx="8" fill="url(#cardGrad5)" stroke="#7c2d12" stroke-width="1" filter="url(#cardShadow5)" />
      <circle cx="28" cy="28" r="14" fill="#ea580c" />
      <text x="28" y="33" class="step-num" text-anchor="middle">2</text>

      <text x="50" y="24" class="card-title">SECADO IMPECABLE</text>
      <text x="50" y="38" class="badge" fill="#f97316" font-size="9.5">CRÍTICO: CERO AGUA</text>

      <line x1="12" y1="50" x2="213" y2="50" stroke="#431407" stroke-width="1" />

      <text x="12" y="70" class="card-text">Abre la bolsa con tijeras y seca</text>
      <text x="12" y="86" class="card-text">la pieza con papel de cocina.</text>
      <text x="12" y="102" class="card-text"><tspan fill="#f87171" font-weight="700">¡Reserva los jugos!</tspan></text>

      <rect x="12" y="118" width="201" height="44" rx="4" fill="#431407" fill-opacity="0.6" stroke="#9a3412" stroke-width="0.5" />
      <text x="18" y="133" class="badge" fill="#fdba74" font-size="9">✔ El agua anula el tostado</text>
      <text x="18" y="149" class="badge" fill="#fdba74" font-size="9">✔ Superficie 100% seca</text>
    </g>

    <!-- STEP 3 -->
    <g transform="translate(483.3, 0)">
      <rect width="225" height="175" rx="8" fill="url(#cardGrad5)" stroke="#ea580c" stroke-width="1.5" filter="url(#cardShadow5)" />
      <circle cx="28" cy="28" r="14" fill="#ef4444" />
      <text x="28" y="33" class="step-num" text-anchor="middle">3</text>

      <text x="50" y="24" class="card-title" fill="#fca5a5">MARCADO MAILLARD</text>
      <text x="50" y="38" class="badge" fill="#fca5a5" font-size="9.5">45 SEG POR LADO</text>

      <line x1="12" y1="50" x2="213" y2="50" stroke="#431407" stroke-width="1" />

      <text x="12" y="70" class="card-text">Sartén de hierro humeante</text>
      <text x="12" y="86" class="card-text">con AOVE + mantequilla.</text>
      <text x="12" y="102" class="card-text"><tspan fill="#f59e0b" font-weight="700">45 seg por cara exactos.</tspan></text>

      <rect x="12" y="118" width="201" height="44" rx="4" fill="#7f1d1d" fill-opacity="0.5" stroke="#ef4444" stroke-width="0.5" />
      <text x="18" y="133" class="badge" fill="#fca5a5" font-size="9">✔ Costra dorada crujiente</text>
      <text x="18" y="149" class="badge" fill="#fca5a5" font-size="9">✔ Arrosé con romero/manteq.</text>
    </g>

    <!-- STEP 4 -->
    <g transform="translate(725, 0)">
      <rect width="225" height="175" rx="8" fill="url(#cardGrad5)" stroke="#7c2d12" stroke-width="1" filter="url(#cardShadow5)" />
      <circle cx="28" cy="28" r="14" fill="#ea580c" />
      <text x="28" y="33" class="step-num" text-anchor="middle">4</text>

      <text x="50" y="24" class="card-title">SALSA &amp; EMPLATADO</text>
      <text x="50" y="38" class="badge" fill="#f97316" font-size="9.5">TOQUE GOURMET</text>

      <line x1="12" y1="50" x2="213" y2="50" stroke="#431407" stroke-width="1" />

      <text x="12" y="70" class="card-text">Corta en medallones al bies,</text>
      <text x="12" y="86" class="card-text">corona con flor de sal Maldon</text>
      <text x="12" y="102" class="card-text">y salsea con los jugos calientes.</text>

      <rect x="12" y="118" width="201" height="44" rx="4" fill="#431407" fill-opacity="0.6" stroke="#9a3412" stroke-width="0.5" />
      <text x="18" y="133" class="badge" fill="#fdba74" font-size="9">✔ Brillo y jugosidad pura</text>
      <text x="18" y="149" class="badge" fill="#fdba74" font-size="9">✔ En tu mesa en 5 minutos</text>
    </g>
  </g>

  <!-- Bottom Visual Section: Comparison Cross-Section (Traditional vs TouChef Sous-Vide) -->
  <g transform="translate(50, 285)">
    <rect width="950" height="265" rx="10" fill="url(#cardGrad5)" stroke="#7c2d12" stroke-width="1" filter="url(#cardShadow5)" />

    <text x="25" y="30" class="card-title" font-size="14" fill="#fed7aa">COMPARATIVA BIOFÍSICA DEL GRADIENTE DE COCCIÓN EN EL CORTE</text>

    <!-- LEFT: Traditional Cooking Meat Slice -->
    <g transform="translate(25, 50)">
      <rect width="425" height="195" rx="8" fill="#0f0906" stroke="#33190b" stroke-width="1" />
      
      <text x="15" y="24" class="vs-label" fill="#ef4444">❌ COCCIÓN TRADICIONAL (Sartén Directa / Horno)</text>

      <!-- Meat Cross-Section Bar (Width 395, Height 50) -->
      <rect x="15" y="38" width="395" height="50" rx="8" fill="url(#meatTradGrad)" stroke="#271810" stroke-width="1" />

      <!-- Brackets / Annotations -->
      <line x1="15" y1="95" x2="100" y2="95" stroke="#ef4444" stroke-width="1.5" />
      <text x="57" y="110" class="badge" fill="#ef4444" font-size="9" text-anchor="middle">40% Seco / Gris</text>

      <line x1="160" y1="95" x2="265" y2="95" stroke="#f59e0b" stroke-width="1.5" />
      <text x="212" y="110" class="badge" fill="#f59e0b" font-size="9" text-anchor="middle">Solo 20% al Punto</text>

      <line x1="325" y1="95" x2="410" y2="95" stroke="#ef4444" stroke-width="1.5" />
      <text x="367" y="110" class="badge" fill="#ef4444" font-size="9" text-anchor="middle">40% Seco / Gris</text>

      <!-- Explanatory Bullet points -->
      <text x="15" y="138" class="card-text" font-size="10">• Gradiente térmico violento por alta temperatura externa (>200°C).</text>
      <text x="15" y="154" class="card-text" font-size="10">• Pérdida de hasta un 30% de peso por evaporación y expulsión de jugos.</text>
      <text x="15" y="170" class="card-text" font-size="10">• Borde exterior duro, reseco y fibroso.</text>
    </g>

    <!-- RIGHT: TouChef Sous-Vide + Maillard Meat Slice -->
    <g transform="translate(500, 50)">
      <rect width="425" height="195" rx="8" fill="#0f0906" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />

      <text x="15" y="24" class="vs-label" fill="#10b981">✔ TOUCHEF SOUS-VIDE + MARCADO MAILLARD 45s</text>

      <!-- Meat Cross-Section Bar (Width 395, Height 50) -->
      <rect x="15" y="38" width="395" height="50" rx="8" fill="url(#meatSousVideGrad)" stroke="#271810" stroke-width="1" />

      <!-- Brackets / Annotations -->
      <line x1="15" y1="95" x2="30" y2="95" stroke="#fbbf24" stroke-width="1.5" />
      <text x="22" y="110" class="badge" fill="#fbbf24" font-size="9" text-anchor="middle">1mm</text>

      <line x1="35" y1="95" x2="390" y2="95" stroke="#34d399" stroke-width="1.5" />
      <text x="212" y="110" class="badge" fill="#34d399" font-size="9.5" text-anchor="middle">98% PUNTO PERFECTO Y JUGOSO DE BORDE A BORDE</text>

      <line x1="395" y1="95" x2="410" y2="95" stroke="#fbbf24" stroke-width="1.5" />
      <text x="402" y="110" class="badge" fill="#fbbf24" font-size="9" text-anchor="middle">1mm</text>

      <!-- Explanatory Bullet points -->
      <text x="15" y="138" class="card-text" font-size="10" fill="#a7f3d0">• Cocción isotérmica homogénea sin gradiente de temperatura destructivo.</text>
      <text x="15" y="154" class="card-text" font-size="10" fill="#a7f3d0">• Reacción de Maillard milimétrica externa sin sobrecocinar el interior.</text>
      <text x="15" y="170" class="card-text" font-size="10" fill="#a7f3d0">• Máxima terneza, retención de colágeno y sabor ultra-concentrado.</text>
    </g>

  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(40, 565)">
    <rect width="970" height="32" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="20" class="card-text" font-size="10.5" fill="#94a3b8">Experiencia de Cliente TouChef: <tspan fill="#fed7aa" font-weight="600">Reacción de Maillard (140°C–165°C)</tspan> | Condensación de compuestos furánicos y pirazinas | Calidad Restaurante en Casa</text>
  </g>
</svg>
