  <style>
    :root {

      --accent-orange: #ff7a18;
      --accent-gold: #ffb347;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 122, 24, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        linear-gradient(180deg, rgba(10, 13, 20, 0.95) 0%, #0a0d14 100%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 80px;
    }

    header {
      padding: 40px 24px 20px;
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 122, 24, 0.12);
      border: 1px solid rgba(255, 122, 24, 0.35);
      border-radius: 9999px;
      color: var(--accent-gold);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      width: fit-content;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 780px;
      margin-top: 4px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      max-width: 1440px;
      margin: 20px auto 30px;
      padding: 0 24px;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-2px);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .stat-value.green { color: var(--accent-emerald); }
    .stat-value.orange { color: var(--accent-gold); }
    .stat-value.cyan { color: var(--accent-cyan); }

    /* Controls & Filter Bar */
    .controls-wrapper {
      max-width: 1440px;
      margin: 0 auto 30px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(18, 24, 38, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(255, 122, 24, 0.2);
    }

    .cat-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cat-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .cat-btn.active {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 122, 24, 0.35);
    }

    .recipes-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 28px;
    }

    .recipe-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .recipe-card:hover {
      border-color: rgba(255, 179, 71, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .recipe-header {
      padding: 20px 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recipe-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-tag {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-gold);

    .purity-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .recipe-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
    }

    .culinary-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 18px 18px;
      background: rgba(10, 13, 20, 0.5);

    .step-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 4px;

      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #000;
    }

    .step-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      cursor: pointer;
    }

    .step-img:hover {
      transform: scale(1.08);
    }

      padding: 12px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 13, 20, 0.3);
    }

    .yt-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .yt-link:hover {
      color: #ff4b4b;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      max-width: 900px;
      width: 100%;
      background: #121826;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-img {

      object-fit: contain;
      background: #000;

    .modal-info {

      justify-content: space-between;
      align-items: center;
    }

      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;

    let currentCat = 'all';

    // Init Category Tabs
    const catTabs = document.getElementById('catTabs');
    for (const [file, cat] of Object.entries(data)) {
      if (cat.recipes.length === 0) continue;
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = file;
      btn.innerHTML = `${cat.icon} ${cat.name} (${cat.recipes.length})`;
      btn.onclick = () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = file;
        renderGrid();
      };
      catTabs.appendChild(btn);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase().trim();
      renderGrid();
    });

    function renderGrid() {
      const grid = document.getElementById('recipesGrid');
      grid.innerHTML = '';

      let allRecs = [];
      for (const [file, cat] of Object.entries(data)) {
        if (currentCat === 'all' || currentCat === file) {
          cat.recipes.forEach(r => allRecs.push({ ...r, catName: cat.name, catIcon: cat.icon }));
        }
      }

      if (currentSearch) {
        allRecs = allRecs.filter(r => r.title.toLowerCase().includes(currentSearch) || r.slug.toLowerCase().includes(currentSearch));
      }

      allRecs.forEach(r => {
        const cleanTitle = r.title.replace(/^[0-9\.\s\uD800-\uDBFF\uDC00-\uDFFF\u2600-\u26FF\u2700-\u27BF]+/, '').trim();
        const card = document.createElement('article');
        card.className = 'recipe-card';
        
        let infoBtnHtml = '';
        if (r.assets.infografia) {
          infoBtnHtml = `<button class="info-btn" style="font-size:0.82rem; color:#ffb347; background:rgba(255,179,71,0.12); border:1px solid rgba(255,179,71,0.35); border-radius:6px; padding:4px 10px; cursor:pointer; font-weight:600;" onclick="openModal('${r.assets.infografia}', '${cleanTitle}', 'Infografía Maestra TouChef 2x2 Dark Glassmorphism')">📊 Infografía 2x2</button>`;
        }

        card.innerHTML = `
          <div class="recipe-header">
            <div class="recipe-meta">
              <span class="category-tag">${r.catIcon} ${r.catName}</span>
              <span class="purity-badge">✓ 100% COMIDA</span>
            </div>
            <h2 class="recipe-title">${cleanTitle}</h2>
          </div>

          <div class="culinary-steps">
            <div class="step-box">
              <span class="step-label">🥩 1. Ingredientes</span>
              <div class="step-img-wrapper">
                <img src="${r.assets.ingredientes}" alt="Ingredientes" class="step-img" loading="lazy" onclick="openModal('${r.assets.ingredientes}', '${cleanTitle}', '1. Mise en Place e Ingredientes Crudos')">
              </div>
            </div>

            <div class="step-box">
              <span class="step-label">🔥 2. Elaboración</span>
              <div class="step-img-wrapper">
                <img src="${r.assets.elaboracion}" alt="Elaboración" class="step-img" loading="lazy" onclick="openModal('${r.assets.elaboracion}', '${cleanTitle}', '2. Paso Técnico de Cocción / Fuego')">
              </div>
            </div>

            <div class="step-box">
              <span class="step-label">🍽️ 3. Resultado</span>
              <div class="step-img-wrapper">
                <img src="${r.assets.resultado}" alt="Resultado" class="step-img" loading="lazy" onclick="openModal('${r.assets.resultado}', '${cleanTitle}', '3. Emplatado y Textura Gastronómica')">
              </div>
            </div>
          </div>

          <div class="recipe-footer">
            <span style="font-size: 0.8rem; color: var(--text-dim);">ID: ${r.slug.substring(0, 20)}...</span>
            <div class="action-links" style="display:flex; align-items:center; gap:8px;">
              ${infoBtnHtml}
              <a href="https://youtu.be/${r.ytId}" target="_blank" rel="noopener noreferrer" class="yt-link">
                <span>▶ YouTube</span>
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderGrid();

    function openModal(src, title, subtitle) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalSubtitle').innerText = subtitle;
      const dl = document.getElementById('modalDownload');
      if (dl) dl.href = src;
      document.getElementById('imgModal').classList.add('active');
    }

      document.getElementById('imgModal').classList.remove('active');
