<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad5" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>

    <!-- External Sealer Gradient -->
    <linearGradient id="extSealerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>

    <!-- Chamber Sealer Gradient -->
    <linearGradient id="chamSealerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082529"/>
      <stop offset="100%" stop-color="#031114"/>
    </linearGradient>

    <filter id="shadowSealer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowVac" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1050" height="720" fill="url(#bgGrad5)" rx="16"/>
  <rect width="1048" height="718" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- HEADER -->
  <g transform="translate(45, 38)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M8 12 L28 12 L28 26 L8 26 Z M18 6 L18 12 M18 26 L18 32 M12 18 L24 18" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    
    <text x="48" y="20" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">FÍSICA DEL ENVASADO AL VACÍO: CAMPANA VS. ASPIRACIÓN EXTERNA</text>
    <text x="48" y="36" fill="#94a3b8" font-size="13" font-weight="400">Dinámica de Fluidos, Presión Residual (2 mbar vs. 250 mbar) y Fenómeno de Ebullición en Frío</text>
  </g>

  <!-- LEFT PANEL: ENVASADORA DE VACÍO EXTERNO (CANAL) -->
  <g transform="translate(45, 95)" filter="url(#shadowSealer)">
    <rect width="460" height="475" rx="14" fill="url(#extSealerGrad)" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.5"/>
    
    <!-- Header Tab -->
    <path d="M 0 14 C 0 6.27, 6.27 0, 14 0 L 446 0 C 453.73 0, 460 6.27, 460 14 L 460 48 L 0 48 Z" fill="#431407"/>
    <text x="18" y="24" fill="#fdba74" font-size="11" font-weight="700">SISTEMA DOMÉSTICO / SEMIPROFESIONAL</text>
    <text x="18" y="40" fill="#ffedd5" font-size="13" font-weight="700">Envasadora de Vacío Externo (Canal/Tobera)</text>

    <!-- Technical Specs Row -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" fill="#94a3b8" font-size="11">Presión residual final:</text>
      <text x="230" y="0" fill="#fdba74" font-size="11" font-weight="700">200 a 250 mbar (Vacío ~75-80%)</text>
      
      <text x="0" y="18" fill="#94a3b8" font-size="11">Gradiente barométrico (ΔP):</text>
      <text x="230" y="18" fill="#ef4444" font-size="11" font-weight="700">760 mbar (Presión aplastante)</text>

      <text x="0" y="36" fill="#94a3b8" font-size="11">Tipo de bolsa requerida:</text>
      <text x="230" y="36" fill="#fed7aa" font-size="11" font-weight="600">Gofrada / Estriada (Alto coste)</text>
    </g>

    <!-- SCHEMATIC DRAWING (EXTERNAL SEALER) -->
    <g transform="translate(18, 120)">
      <rect width="424" height="210" rx="8" fill="#080402" stroke="#431407" stroke-width="1"/>
      
      <!-- Atmospheric Pressure Outside Arrows pressing down -->
      <g stroke="#f97316" stroke-width="1.8" marker-end="none">
        <line x1="60" y1="15" x2="60" y2="45"/>
        <line x1="360" y1="15" x2="360" y2="45"/>
        <line x1="30" y1="120" x2="60" y2="120"/>
        <line x1="390" y1="120" x2="360" y2="120"/>
      </g>
      <text x="212" y="24" fill="#fb923c" font-size="10" font-weight="700" text-anchor="middle">Presión Atmosférica Exterior: 1.013 mbar</text>

      <!-- The Sealer Machine Body (Top) -->
      <rect x="80" y="35" width="264" height="40" rx="4" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
      <rect x="110" y="45" width="204" height="8" rx="2" fill="#ef4444"/>
      <text x="212" y="52" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">BARRA DE SELLADO Y CANAL DE SUCCIÓN</text>

      <!-- The Bag (Compressed) -->
      <path d="M 120 75 L 120 180 Q 212 195, 304 180 L 304 75" fill="#292524" fill-opacity="0.6" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,2"/>
      
      <!-- Liquid Being Sucked UPWARDS -->
      <path d="M 125 140 C 140 110, 180 80, 212 75 C 244 80, 284 110, 299 140 L 299 180 Q 212 190, 125 180 Z" 
            fill="#d97706" fill-opacity="0.75"/>
      
      <!-- Upward arrows indicating liquid escaping -->
      <path d="M 212 110 L 212 80 M 206 88 L 212 80 L 218 88" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      
      <rect x="100" y="125" width="224" height="34" rx="4" fill="#1c0c05" stroke="#ea580c" stroke-width="1"/>
      <text x="212" y="139" fill="#fed7aa" font-size="9" font-weight="700" text-anchor="middle">⚠️ EL LÍQUIDO SUBE A LA BARRA</text>
      <text x="212" y="151" fill="#fca5a5" font-size="8" text-anchor="middle">Anula el sellado y daña la bomba mecánica</text>
    </g>

    <!-- BEHAVIOR SUMMARY -->
    <g transform="translate(18, 345)">
      <text x="0" y="0" fill="#fb923c" font-size="11" font-weight="700">📋 Limitaciones Físicas:</text>
      <text x="12" y="18" fill="#ffedd5" font-size="10">• <tspan font-weight="700">Imposible envasar líquidos:</tspan> Caldos y salsas se fugan por succión.</text>
      <text x="12" y="34" fill="#ffedd5" font-size="10">• <tspan font-weight="700">Oxígeno residual elevado (20-25%):</tspan> Menor vida útil en grasas.</text>
      <text x="12" y="50" fill="#ffedd5" font-size="10">• <tspan font-weight="700">Aplastamiento mecánico:</tspan> Deforma alimentos tiernos (croquetas, hojas).</text>
    </g>

    <!-- Bottom Status -->
    <rect x="18" y="425" width="424" height="34" rx="6" fill="#451a03" stroke="#ea580c" stroke-width="1.2"/>
    <text x="230" y="446" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle">APTO SOLO PARA SÓLIDOS SECOS O CONGELADOS</text>
  </g>

  <!-- RIGHT PANEL: ENVASADORA DE CAMPANA (CHAMBER SEALER) -->
  <g transform="translate(545, 95)" filter="url(#shadowSealer)">
    <rect width="460" height="475" rx="14" fill="url(#chamSealerGrad)" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1.5"/>
    
    <!-- Header Tab -->
    <path d="M 0 14 C 0 6.27, 6.27 0, 14 0 L 446 0 C 453.73 0, 460 6.27, 460 14 L 460 48 L 0 48 Z" fill="#083344"/>
    <text x="18" y="24" fill="#67e8f9" font-size="11" font-weight="700">SISTEMA PROFESIONAL TOUCHEF</text>
    <text x="18" y="40" fill="#cffafe" font-size="13" font-weight="700">Envasadora de Campana (Chamber Vacuum Sealer)</text>

    <!-- Technical Specs Row -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" fill="#94a3b8" font-size="11">Presión residual final:</text>
      <text x="230" y="0" fill="#22d3ee" font-size="11" font-weight="700">2 a 5 mbar (Vacío Real 99.8%)</text>
      
      <text x="0" y="18" fill="#94a3b8" font-size="11">Gradiente barométrico (ΔP):</text>
      <text x="230" y="18" fill="#10b981" font-size="11" font-weight="700">0 mbar (Cero diferencia de presión)</text>

      <text x="0" y="36" fill="#94a3b8" font-size="11">Tipo de bolsa requerida:</text>
      <text x="230" y="36" fill="#a5f3fc" font-size="11" font-weight="600">Lisa Multicapa PA/PE (Económica)</text>
    </g>

    <!-- SCHEMATIC DRAWING (CHAMBER SEALER) -->
    <g transform="translate(18, 120)">
      <rect width="424" height="210" rx="8" fill="#021014" stroke="#083344" stroke-width="1"/>
      
      <!-- Depressurized Chamber Dome -->
      <path d="M 30 190 L 30 60 Q 212 15, 394 60 L 394 190 Z" fill="#0c4a6e" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.8"/>
      <text x="212" y="40" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Cámara Sellada Hermética (Presión: 2 mbar en todo el recinto)</text>

      <!-- The Sealer Bar (Inside chamber) -->
      <rect x="80" y="70" width="264" height="18" rx="3" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <rect x="110" y="75" width="204" height="8" rx="2" fill="#10b981"/>
      <text x="212" y="82" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">BARRA DE SELLADO NEUMÁTICA</text>

      <!-- The Open Bag (Relaxed, no pressure differential) -->
      <path d="M 120 85 L 120 180 Q 212 195, 304 180 L 304 85" fill="#082f49" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- Liquid RESTING STABLE at Bottom -->
      <path d="M 122 145 Q 212 148, 302 145 L 302 180 Q 212 193, 122 180 Z" 
            fill="#06b6d4" fill-opacity="0.75" filter="url(#glowVac)"/>
      
      <!-- Equal pressure arrows inside and outside bag -->
      <text x="75" y="130" fill="#67e8f9" font-size="10">P₁ = 2 mbar</text>
      <text x="295" y="130" fill="#67e8f9" font-size="10">P₂ = 2 mbar</text>
      
      <rect x="100" y="125" width="224" height="34" rx="4" fill="#042f2e" stroke="#059669" stroke-width="1"/>
      <text x="212" y="139" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">✓ LÍQUIDO 100% ESTABLE Y ESTÁTICO</text>
      <text x="212" y="151" fill="#6ee7b7" font-size="8" text-anchor="middle">ΔP = 0 ➔ No hay empuje ni fuga hacia la barra</text>
    </g>

    <!-- BEHAVIOR SUMMARY -->
    <g transform="translate(18, 345)">
      <text x="0" y="0" fill="#22d3ee" font-size="11" font-weight="700">🌟 Ventajas Termodinámicas:</text>
      <text x="12" y="18" fill="#cffafe" font-size="10">• <tspan font-weight="700">Envasado perfecto de líquidos:</tspan> Caldos, sopas, salsas, marinadas.</text>
      <text x="12" y="34" fill="#cffafe" font-size="10">• <tspan font-weight="700">Vacío extremo 99.8%:</tspan> Anoxia total, inhibe proliferación aerobia.</text>
      <text x="12" y="50" fill="#cffafe" font-size="10">• <tspan font-weight="700">Infusiones y marinadas flash:</tspan> Porosidad acelerada en &lt;60 seg.</text>
    </g>

    <!-- Bottom Status -->
    <rect x="18" y="425" width="424" height="34" rx="6" fill="#042f2e" stroke="#059669" stroke-width="1.2"/>
    <text x="230" y="446" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">ESTÁNDAR PROFESIONAL: LÍQUIDOS, SÓLIDOS Y SOUS-VIDE</text>
  </g>

  <!-- BOTTOM THERMODYNAMIC CALLOUT: COLD BOILING POINT PHENOMENON -->
  <g transform="translate(45, 582)" filter="url(#shadowSealer)">
    <rect width="960" height="108" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <g transform="translate(22, 20)">
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700">⚡ TERMODINÁMICA: EL FENÓMENO DE EBULLICIÓN EN FRÍO (Punto de Ebullición vs Presión)</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">Según la ecuación de Clausius-Clapeyron, la temperatura de ebullición del agua decrece drásticamente al reducir la presión ambiental:</text>
      
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="170" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="85" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">1.013 mbar ➔ <tspan fill="#f87171" font-weight="700">100.0°C</tspan></text>

        <rect x="185" y="0" width="170" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="270" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">95 mbar ➔ <tspan fill="#fb923c" font-weight="700">45.0°C</tspan></text>

        <rect x="370" y="0" width="170" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="455" y="18" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">31 mbar ➔ <tspan fill="#fbbf24" font-weight="700">25.0°C</tspan></text>

        <rect x="555" y="0" width="170" height="28" rx="4" fill="#083344" stroke="#0284c7" stroke-width="1"/>
        <text x="640" y="18" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle">10 mbar ➔ <tspan fill="#38bdf8" font-weight="700">6.7°C</tspan></text>

        <rect x="740" y="0" width="170" height="28" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="825" y="18" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">2 mbar ➔ <tspan fill="#34d399">-10.0°C</tspan></text>
      </g>
      
      <text x="0" y="76" fill="#fca5a5" font-size="9.5" font-weight="600">⚠️ REGLA TOUCHEF OBLIGATORIA: Abatir todo caldo o salsa a T ≤ 3°C - 4°C antes de envasar en campana para evitar ebullición violenta y saturación de la bomba de aceite.</text>
    </g>
  </g>
</svg>
