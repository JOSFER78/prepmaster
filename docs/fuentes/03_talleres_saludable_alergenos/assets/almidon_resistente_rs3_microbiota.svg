<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background:#090e17; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Phase Gradients -->
    <linearGradient id="gPhase1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="gPhase2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="gPhase3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#15803d"/></linearGradient>

    <!-- AGCC Metabolite Gradients -->
    <linearGradient id="gButyrate" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="gPropionate" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="gAcetate" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient>

    <!-- Shadows -->
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad3)"/>

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="850"/>
    <line x1="400" y1="0" x2="400" y2="850"/>
    <line x1="800" y1="0" x2="800" y2="850"/>
    <line x1="1140" y1="0" x2="1140" y2="850"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="460" x2="1200" y2="460"/>
    <line x1="0" y1="740" x2="1200" y2="740"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 30)">
    <rect width="1100" height="75" rx="14" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
    
    <!-- Microbe / Molecule Icon -->
    <rect x="18" y="15" width="46" height="46" rx="10" fill="#15803d"/>
    <circle cx="41" cy="38" r="10" fill="#4ade80" fill-opacity="0.8"/>
    <circle cx="34" cy="32" r="3" fill="#ffffff"/>
    <circle cx="46" cy="42" r="3" fill="#ffffff"/>
    <circle cx="45" cy="30" r="2" fill="#ffffff"/>

    <!-- Title and Subtitle -->
    <text x="76" y="35" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="0.5">BIOQUÍMICA DEL ALMIDÓN RESISTENTE RS3 Y MICROBIOTA</text>
    <text x="76" y="53" font-size="12" font-weight="600" fill="#94a3b8">Retrogradación Térmica Culinaria (24h a 4°C) · Cinética Glucémica · Fermentación en Colon y Síntesis de AGCC</text>
    
    <!-- Right Badge -->
    <rect x="915" y="20" width="165" height="35" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
    <circle cx="932" cy="37" r="5" fill="#22c55e"/>
    <text x="946" y="42" font-size="11.5" font-weight="700" fill="#dcfce7">EJE COLON-MICROBIOMA</text>
  </g>

  <!-- MAIN 3-STEP FLOW (y=130 to 450) -->

  <!-- STEP 1: GELATINIZACIÓN TÉRMICA -->
  <g transform="translate(50, 130)" filter="url(#shadow3)">
    <rect width="340" height="320" rx="14" fill="url(#cardGrad3)" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="16" y="16" width="308" height="38" rx="8" fill="#450a0a"/>
    <circle cx="36" cy="35" r="12" fill="url(#gPhase1)"/>
    <text x="36" y="40" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
    <text x="56" y="39" font-size="13" font-weight="900" fill="#fca5a5">GELATINIZACIÓN (&gt;70°C)</text>
    
    <!-- Diagram: Hydrated loose starch -->
    <g transform="translate(20, 70)">
      <rect width="300" height="110" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <path d="M 30 55 Q 60 20 100 55 T 170 55 T 240 55" stroke="#f87171" stroke-width="3" fill="none"/>
      <path d="M 40 75 Q 80 40 120 75 T 190 75 T 260 75" stroke="#fb923c" stroke-width="2.5" fill="none"/>
      <path d="M 50 35 Q 90 60 130 35 T 200 35 T 270 35" stroke="#fca5a5" stroke-width="2.5" fill="none"/>
      <!-- Alpha-Amylase Attack Pacman -->
      <circle cx="210" cy="55" r="14" fill="#ef4444"/>
      <path d="M 210 55 L 224 47 A 14 14 0 0 1 224 63 Z" fill="#0b1120"/>
      <text x="210" y="85" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">α-Amilasa Humana</text>
      <text x="75" y="25" font-size="10" font-weight="700" fill="#f8fafc">Cadenas Desplegadas</text>
    </g>

    <text x="20" y="205" font-size="11.5" font-weight="700" fill="#f8fafc">Comportamiento Duodenal:</text>
    <text x="20" y="225" font-size="10.5" fill="#cbd5e1">• Ruptura de puentes de hidrógeno por calor.</text>
    <text x="20" y="243" font-size="10.5" fill="#cbd5e1">• Hidrólisis enzimática ultrarrápida al 100%.</text>
    <text x="20" y="261" font-size="10.5" fill="#f87171">• Pico de Glucosa plasmática e Insulina.</text>
    <rect x="20" y="278" width="300" height="26" rx="6" fill="#1f1315"/>
    <text x="170" y="295" font-size="10" font-weight="800" fill="#fca5a5" text-anchor="middle">Arroz caliente / Puré: IG &gt; 85 (Rápida Absorción)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(400, 270)">
    <circle cx="15" cy="0" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 10 -6 L 18 0 L 10 6" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- STEP 2: RETROGRADACIÓN TÉRMICA 24H 4°C -->
  <g transform="translate(430, 130)" filter="url(#shadow3)">
    <rect width="340" height="320" rx="14" fill="url(#cardGrad3)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="16" y="16" width="308" height="38" rx="8" fill="#082f49"/>
    <circle cx="36" cy="35" r="12" fill="url(#gPhase2)"/>
    <text x="36" y="40" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    <text x="56" y="39" font-size="13" font-weight="900" fill="#7dd3fc">RETROGRADACIÓN (24h a 4°C)</text>

    <!-- Diagram: Tight Crystalline Double Helix RS3 -->
    <g transform="translate(20, 70)">
      <rect width="300" height="110" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <!-- Interlocked crystal lattice -->
      <g stroke="#38bdf8" stroke-width="2.5" fill="none">
        <path d="M 40 40 Q 70 65 100 40 T 160 40 T 220 40 T 270 40"/>
        <path d="M 40 52 Q 70 27 100 52 T 160 52 T 220 52 T 270 52"/>
        <path d="M 40 70 Q 70 95 100 70 T 160 70 T 220 70 T 270 70"/>
        <path d="M 40 82 Q 70 57 100 82 T 160 82 T 220 82 T 270 82"/>
      </g>
      <!-- Shield Barrier vs Amylase -->
      <line x1="190" y1="20" x2="190" y2="100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
      <circle cx="240" cy="55" r="12" fill="#64748b"/>
      <line x1="232" y1="47" x2="248" y2="63" stroke="#ef4444" stroke-width="2"/>
      <text x="240" y="85" font-size="8.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Amilasa Bloqueada</text>
      <text x="90" y="24" font-size="10" font-weight="800" fill="#7dd3fc">Cristalización Doble Hélice</text>
    </g>

    <text x="20" y="205" font-size="11.5" font-weight="700" fill="#f8fafc">Ingeniería TouChef RS3:</text>
    <text x="20" y="225" font-size="10.5" fill="#cbd5e1">• Realineación de amilosa por enlaces H.</text>
    <text x="20" y="243" font-size="10.5" fill="#cbd5e1">• Estructura cristalina insoluble al agua.</text>
    <text x="20" y="261" font-size="10.5" fill="#38bdf8">• Inmune a digestión duodenal; pasa a colon.</text>
    <rect x="20" y="278" width="300" height="26" rx="6" fill="#082f49"/>
    <text x="170" y="295" font-size="10" font-weight="800" fill="#bae6fd" text-anchor="middle">Aplanamiento Glucémico: -25% Kcal Netas</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(780, 270)">
    <circle cx="15" cy="0" r="16" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M 10 -6 L 18 0 L 10 6" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- STEP 3: FERMENTACIÓN COLÓNICA & AGCC -->
  <g transform="translate(810, 130)" filter="url(#shadow3)">
    <rect width="340" height="320" rx="14" fill="url(#cardGrad3)" stroke="#15803d" stroke-width="1.5"/>
    <rect x="16" y="16" width="308" height="38" rx="8" fill="#052e16"/>
    <circle cx="36" cy="35" r="12" fill="url(#gPhase3)"/>
    <text x="36" y="40" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <text x="56" y="39" font-size="13" font-weight="900" fill="#86efac">FERMENTACIÓN EN COLON</text>

    <!-- Diagram: Colonocytes + SCFA release -->
    <g transform="translate(20, 70)">
      <rect width="300" height="110" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      
      <!-- Bacteria cluster -->
      <circle cx="45" cy="40" r="12" fill="#22c55e" fill-opacity="0.8"/>
      <circle cx="70" cy="55" r="14" fill="#16a34a" fill-opacity="0.8"/>
      <circle cx="50" cy="70" r="10" fill="#4ade80" fill-opacity="0.8"/>
      <text x="55" y="95" font-size="8.5" font-weight="700" fill="#86efac" text-anchor="middle">Faecalibacterium</text>

      <!-- Colon Wall Layer (Tight Junctions) -->
      <g transform="translate(140, 20)">
        <rect x="0" y="0" width="30" height="50" rx="4" fill="#0284c7"/>
        <rect x="34" y="0" width="30" height="50" rx="4" fill="#0284c7"/>
        <rect x="68" y="0" width="30" height="50" rx="4" fill="#0284c7"/>
        <rect x="102" y="0" width="30" height="50" rx="4" fill="#0284c7"/>
        <!-- Claudin / Occludin Seals -->
        <rect x="28" y="15" width="8" height="6" fill="#22c55e"/>
        <rect x="62" y="15" width="8" height="6" fill="#22c55e"/>
        <rect x="96" y="15" width="8" height="6" fill="#22c55e"/>
        <text x="65" y="68" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">Colonocitos Sellados</text>
      </g>
    </g>

    <text x="20" y="205" font-size="11.5" font-weight="700" fill="#f8fafc">Metabolitos Maestros Producidos:</text>
    <text x="20" y="225" font-size="10.5" fill="#86efac">• Butirato (C4): Nutre el 70% del epitelio colónico.</text>
    <text x="20" y="243" font-size="10.5" fill="#cbd5e1">• Propionato (C3): Control hepático y saciedad.</text>
    <text x="20" y="261" font-size="10.5" fill="#cbd5e1">• Acetato (C2): Acidificación luminal pH 5.5.</text>
    <rect x="20" y="278" width="300" height="26" rx="6" fill="#052e16"/>
    <text x="170" y="295" font-size="10" font-weight="800" fill="#bbf7d0" text-anchor="middle">Cierre de Barrera: Cero Permeabilidad LPS</text>
  </g>

  <!-- LOWER SECTION: THE 3 SHORT-CHAIN FATTY ACIDS (AGCC / SCFA) CARDS (y=475 to 730) -->
  
  <!-- 1. BUTIRATO (Card 1) -->
  <g transform="translate(50, 475)" filter="url(#shadow3)">
    <rect width="340" height="240" rx="14" fill="url(#cardGrad3)" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="16" y="16" width="308" height="34" rx="6" fill="#052e16"/>
    <circle cx="34" cy="33" r="10" fill="url(#gButyrate)"/>
    <text x="52" y="37" font-size="13" font-weight="900" fill="#4ade80">BUTIRATO (Ácido Butírico · C₄)</text>
    
    <text x="18" y="75" font-size="11.5" font-weight="800" fill="#f8fafc">Combustible Primario Epitelial (70%)</text>
    <text x="18" y="98" font-size="10.5" fill="#cbd5e1">• Estímulo directo de Claudinas y Ocludinas.</text>
    <text x="18" y="118" font-size="10.5" fill="#cbd5e1">• Sella las <tspan fill="#86efac" font-weight="700">uniones estrechas (Tight Junctions)</tspan>.</text>
    <text x="18" y="138" font-size="10.5" fill="#cbd5e1">• Frena la traslocación de endotoxinas LPS.</text>
    <text x="18" y="158" font-size="10.5" fill="#cbd5e1">• Inducción de Linfocitos T reguladores (Tregs).</text>
    <text x="18" y="178" font-size="10.5" fill="#cbd5e1">• Estimula la proliferación de <tspan fill="#4ade80">Akkermansia</tspan>.</text>
    
    <rect x="18" y="196" width="304" height="28" rx="6" fill="#14532d"/>
    <text x="170" y="215" font-size="10.5" font-weight="800" fill="#dcfce7" text-anchor="middle">Protector Máximo contra Cáncer Colorrectal</text>
  </g>

  <!-- 2. PROPIONATO (Card 2) -->
  <g transform="translate(430, 475)" filter="url(#shadow3)">
    <rect width="340" height="240" rx="14" fill="url(#cardGrad3)" stroke="#d97706" stroke-width="1.5"/>
    <rect x="16" y="16" width="308" height="34" rx="6" fill="#451a03"/>
    <circle cx="34" cy="33" r="10" fill="url(#gPropionate)"/>
    <text x="52" y="37" font-size="13" font-weight="900" fill="#fbbf24">PROPIONATO (Ácido Propiónico · C₃)</text>

    <text x="18" y="75" font-size="11.5" font-weight="800" fill="#f8fafc">Regulación Metabólica Portal Hepática</text>
    <text x="18" y="98" font-size="10.5" fill="#cbd5e1">• Transporte directo vía vena porta al hígado.</text>
    <text x="18" y="118" font-size="10.5" fill="#cbd5e1">• Inhibe la gluconeogénesis hepática.</text>
    <text x="18" y="138" font-size="10.5" fill="#cbd5e1">• Estimula secreción de péptidos <tspan fill="#fde68a" font-weight="700">GLP-1 y PYY</tspan>.</text>
    <text x="18" y="158" font-size="10.5" fill="#cbd5e1">• Modula la saciedad a nivel hipotalámico.</text>
    <text x="18" y="178" font-size="10.5" fill="#cbd5e1">• Reduce la síntesis endógena de colesterol LDL.</text>

    <rect x="18" y="196" width="304" height="28" rx="6" fill="#78350f"/>
    <text x="170" y="215" font-size="10.5" font-weight="800" fill="#fef3c7" text-anchor="middle">Control Glucémico &amp; Sensibilidad Insulina</text>
  </g>

  <!-- 3. ACETATO (Card 3) -->
  <g transform="translate(810, 475)" filter="url(#shadow3)">
    <rect width="340" height="240" rx="14" fill="url(#cardGrad3)" stroke="#7e22ce" stroke-width="1.5"/>
    <rect x="16" y="16" width="308" height="34" rx="6" fill="#3b0764"/>
    <circle cx="34" cy="33" r="10" fill="url(#gAcetate)"/>
    <text x="52" y="37" font-size="13" font-weight="900" fill="#c084fc">ACETATO (Ácido Acético · C₂)</text>

    <text x="18" y="75" font-size="11.5" font-weight="800" fill="#f8fafc">Homeostasis Luminal &amp; Sustrato Periférico</text>
    <text x="18" y="98" font-size="10.5" fill="#cbd5e1">• Es el AGCC más abundante (&gt;60% del pool total).</text>
    <text x="18" y="118" font-size="10.5" fill="#cbd5e1">• Acidifica el lumen colónico a <tspan fill="#e9d5ff" font-weight="700">pH 5.5</tspan>.</text>
    <text x="18" y="138" font-size="10.5" fill="#cbd5e1">• Inhibe proliferación de patógenos (E. coli, Clostridium).</text>
    <text x="18" y="158" font-size="10.5" fill="#cbd5e1">• Sustrato energético para tejido muscular y cerebral.</text>
    <text x="18" y="178" font-size="10.5" fill="#cbd5e1">• Favorece la síntesis de colesterol protector HDL.</text>

    <rect x="18" y="196" width="304" height="28" rx="6" fill="#581c87"/>
    <text x="170" y="215" font-size="10.5" font-weight="800" fill="#f3e8ff" text-anchor="middle">Barrera Antimicrobiana &amp; Metabolismo Sistémico</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(50, 735)">
    <rect width="1100" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="550" y="25" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">
      PROTOCOLO TOUCHEF BATCH COOKING: Cocción completa + Abatimiento + Reposo 24h a 3°C + Regeneración suave &lt;130°C
    </text>
    <text x="550" y="45" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Eficaz en patatas enteras con piel, boniatos, arroz integral, avena cortada, trigo sarraceno y legumbres nobles.
    </text>
  </g>

  <!-- Legal / Source Note -->
  <text x="600" y="825" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">
    Fuente Bioquímica: Manual Clínico-Culinario TouChef Master Series · Fisiopatología Gastrointestinal &amp; Nutrición Traslacional
  </text>
</svg>
