    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
